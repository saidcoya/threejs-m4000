<body>

```
<!-- =============================== -->
<!-- INFORMACIÓN -->
<!-- =============================== -->

<div id="info">

    <div id="title">

        Demo Perfil 3D M4000

    </div>


    <div id="status">

    </div>


    <div>

        Ángulo:

        <span id="angle"
              class="value">

        </span>

        °

        <span id="sensorMin"
              class="value">

    </div>


    <div>

        Sensor máximo:

        <span id="sensorMax"
              class="value">

            ---

        </span>

    </div>


    <div id="error"></div>

</div>


<!-- =============================== -->
<!-- PERFIL 2D -->
<!-- =============================== -->

<div id="profile">

    <div>

        Perfil de sensores

    </div>


    <canvas

        id="profileCanvas"

        width="400"

        height="250">

    </canvas>

</div>


<!-- =============================== -->
<!-- THREE.JS -->
<!-- =============================== -->

<script type="module">


    import * as THREE from

    'https://unpkg.com/three@0.178.0/build/three.module.js';


    // ==========================================
    // VARIABLES
    // ==========================================


    let currentData = null;


    // ==========================================
    // ESCENA THREE.JS
    // ==========================================


    const scene =

        new THREE.Scene();


    scene.background =

        new THREE.Color(0x111111);


    // ==========================================
    // CÁMARA
    // ==========================================


    const camera =

        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /

            window.innerHeight,

            0.1,

            1000

        );


    camera.position.set(

        0,

        0,

        5

    );


    // ==========================================
    // RENDERER
    // ==========================================


    const renderer =

        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    // ==========================================
    // LUCES
    // ==========================================


    const ambientLight =

        new THREE.AmbientLight(

            0xffffff,

            1

        );


    scene.add(

        ambientLight

    );


    const directionalLight =

        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directionalLight.position.set(

        5,

        5,

        5

    );


    scene.add(

        directionalLight

    );


    // ==========================================
    // OBJETO DE PRUEBA
    // ==========================================


    const geometry =

        new THREE.BoxGeometry(

            2,

            2,

            2

        );


    const material =

        new THREE.MeshStandardMaterial({

            color: 0x00ff00

        });


    const cube =

        new THREE.Mesh(

            geometry,

            material

        );


    scene.add(

        cube

    );


    // ==========================================
    // DIBUJAR PERFIL 2D
    // ==========================================


    function dibujarPerfil(

        sensores

    ) {


        const canvas =

            document.getElementById(

                'profileCanvas'

            );


        const ctx =

            canvas.getContext(

                '2d'

            );


        ctx.clearRect(

            0,

            0,

            canvas.width,

            canvas.height

        );


        if (

            !sensores ||

            sensores.length === 0

        ) {

            return;

        }


        const min =

            Math.min(

                ...sensores

            );


        const max =

            Math.max(

                ...sensores

            );


        const rango =

            max - min || 1;


        ctx.beginPath();


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length - 1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor - min

                        ) /

                        rango

                    )

                    *

                    canvas.height;


                if (

                    index === 0

                ) {

                    ctx.moveTo(

                        x,

                        y

                    );

                }

                else {

                    ctx.lineTo(

                        x,

                        y

                    );

                }


            }

        );


        ctx.strokeStyle =

            '#00ffff';


        ctx.lineWidth =

            2;


        ctx.stroke();


        // Dibujar puntos


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length - 1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor - min

                        ) /

                        rango

                    )

                    *

                    canvas.height;


                ctx.beginPath();


                ctx.arc(

                    x,

                    y,

                    3,

                    0,

                    Math.PI * 2

                );


                ctx.fillStyle =

                    '#ffffff';


                ctx.fill();


            }

        );


    }


    // ==========================================
    // ACTUALIZAR DATOS DESDE NODE-RED
    // ==========================================


    async function actualizarDatos() {


        try {


            const response =

                await fetch(

                    '/u-os-app-node-red-host/red/api/m4000/demo/profile'

                );


            if (

                !response.ok

            ) {


                throw new Error(

                    `HTTP ${response.status}`

                );

            }


            const data =

                await response.json();


            console.log(

                'Perfil recibido:',

                data

            );


            currentData =

                data;


            // =========================
            // ACTUALIZAR INFORMACIÓN
            // =========================


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: CONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#00ff00';


            document.getElementById(

                'angle'

            ).textContent =

                data.angle;


            document.getElementById(

                'sensorCount'

            ).textContent =

                data.sensors.length;


            document.getElementById(

                'sensorMin'

            ).textContent =

                Math.min(

                    ...data.sensors

                );


            document.getElementById(

                'sensorMax'

            ).textContent =

                Math.max(

                    ...data.sensors

                );


            // =========================
            // DIBUJAR PERFIL
            // =========================


            dibujarPerfil(

                data.sensors

            );


            // =========================
            // ANIMACIÓN DEL CUBO
            // =========================


            cube.rotation.x =

                data.angle *

                Math.PI /

                180;


            cube.rotation.y =

                data.angle *

                Math.PI /

                180;


        }


        catch (

            error

        ) {


            console.error(

                'Error leyendo Node-RED:',

                error

            );


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: DESCONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#ff0000';


            document.getElementById(

                'error'

            ).textContent =

                error.message;


        }


    }


    // ==========================================
    // ANIMACIÓN
    // ==========================================


    function animate() {


        requestAnimationFrame(

            animate

        );


        renderer.render(

            scene,

            camera

        );


    }


    animate();


    // ==========================================
    // REDIMENSIONAR VENTANA
    // ==========================================


    window.addEventListener(

        'resize',

        () => {


            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );


        }

    );


    // ==========================================
    // ARRANQUE
    // ==========================================


    actualizarDatos();


    setInterval(

        actualizarDatos,

        1000

    );


</script>
