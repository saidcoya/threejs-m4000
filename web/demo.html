<script type="module">


    import * as THREE from

    'https://unpkg.com/three@0.178.0/build/three.module.js';


    import { OrbitControls } from

    'https://unpkg.com/three@0.178.0/examples/jsm/controls/OrbitControls.js';


    // =================================
    // VARIABLES
    // =================================


    let currentData = null;

    let troncoMesh = null;

    let puntosMesh = null;


    const NUM_SENSORES = 32;


    // =================================
    // ESCENA
    // =================================


    const scene =

        new THREE.Scene();


    scene.background =

        new THREE.Color(

            0x111111

        );


    // =================================
    // CÁMARA
    // =================================


    const camera =

        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /

            window.innerHeight,

            0.1,

            10000

        );


    camera.position.set(

        2500,

        1800,

        2500

    );


    // =================================
    // RENDERER
    // =================================


    const renderer =

        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        window.devicePixelRatio

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    // =================================
    // CONTROLES
    // =================================


    const controls =

        new OrbitControls(

            camera,

            renderer.domElement

        );


    controls.enableDamping = true;


    controls.dampingFactor = 0.05;


    controls.target.set(

        0,

        0,

        0

    );


    // =================================
    // LUCES
    // =================================


    const ambientLight =

        new THREE.AmbientLight(

            0xffffff,

            1.5

        );


    scene.add(

        ambientLight

    );


    const directionalLight =

        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    directionalLight.position.set(

        3000,

        3000,

        3000

    );


    scene.add(

        directionalLight

    );


    // =================================
    // EJES DE REFERENCIA
    // =================================


    const axesHelper =

        new THREE.AxesHelper(

            1500

        );


    scene.add(

        axesHelper

    );


    // =================================
    // CREAR SUPERFICIE 3D
    // =================================


    function crearTronco3D(

        perfiles

    ) {


        // ---------------------------------
        // VALIDACIÓN
        // ---------------------------------


        if (

            !perfiles ||

            perfiles.length < 2

        ) {

            return;

        }


        const numPerfiles =

            perfiles.length;


        const numSensores =

            NUM_SENSORES;


        // ---------------------------------
        // ELIMINAR MALLA ANTERIOR
        // ---------------------------------


        if (

            troncoMesh

        ) {


            scene.remove(

                troncoMesh

            );


            troncoMesh.geometry.dispose();


            troncoMesh.material.dispose();


            troncoMesh = null;

        }


        // ---------------------------------
        // GEOMETRÍA
        // ---------------------------------


        const geometry =

            new THREE.BufferGeometry();


        const vertices = [];


        const indices = [];


        // ---------------------------------
        // ESCALA
        // ---------------------------------


        const escala = 1;


        // ---------------------------------
        // CREAR VÉRTICES
        // ---------------------------------


        for (

            let p = 0;

            p < numPerfiles;

            p++

        ) {


            const perfil =

                perfiles[p];


            if (

                !perfil ||

                !Array.isArray(

                    perfil.sensors

                )

            ) {

                continue;

            }


            const angle =

                (

                    perfil.angle *

                    Math.PI /

                    180

                );


            const cosAngle =

                Math.cos(

                    angle

                );


            const sinAngle =

                Math.sin(

                    angle

                );


            for (

                let s = 0;

                s < numSensores;

                s++

            ) {


                const sensorValue =

                    perfil.sensors[s];


                if (

                    sensorValue ===

                    undefined

                ) {

                    continue;

                }


                // ---------------------------------
                // ÁNGULO DEL SENSOR
                // ---------------------------------


                const sensorAngle =

                    (

                        s /

                        numSensores

                    ) *

                    Math.PI *

                    2;


                // ---------------------------------
                // RADIO DEL SENSOR
                // ---------------------------------


                const radio =

                    sensorValue *

                    escala;


                // ---------------------------------
                // PUNTO DEL PERFIL
                // ---------------------------------


                const xPerfil =

                    Math.cos(

                        sensorAngle

                    ) *

                    radio;


                const zPerfil =

                    Math.sin(

                        sensorAngle

                    ) *

                    radio;


                // ---------------------------------
                // ROTAR PERFIL ALREDEDOR DEL EJE Y
                // ---------------------------------


                const x =

                    xPerfil *

                    cosAngle +

                    zPerfil *

                    sinAngle;


                const z =

                    -xPerfil *

                    sinAngle +

                    zPerfil *

                    cosAngle;


                // ---------------------------------
                // EJE LONGITUDINAL
                // ---------------------------------


                const y =

                    (

                        p -

                        (

                            numPerfiles -

                            1

                        ) /

                        2

                    ) *

                    30;


                vertices.push(

                    x,

                    y,

                    z

                );

            }

        }


        // ---------------------------------
        // CREAR TRIÁNGULOS
        // ---------------------------------


        for (

            let p = 0;

            p < numPerfiles - 1;

            p++

        ) {


            for (

                let s = 0;

                s < numSensores;

                s++

            ) {


                const siguienteSensor =

                    (

                        s +

                        1

                    ) %

                    numSensores;


                const a =

                    p *

                    numSensores +

                    s;


                const b =

                    p *

                    numSensores +

                    siguienteSensor;


                const c =

                    (

                        p +

                        1

                    ) *

                    numSensores +

                    siguienteSensor;


                const d =

                    (

                        p +

                        1

                    ) *

                    numSensores +

                    s;


                indices.push(

                    a,

                    b,

                    d

                );


                indices.push(

                    b,

                    c,

                    d

                );

            }

        }


        // ---------------------------------
        // ASIGNAR GEOMETRÍA
        // ---------------------------------


        geometry.setAttribute(

            'position',

            new THREE.Float32BufferAttribute(

                vertices,

                3

            )

        );


        geometry.setIndex(

            indices

        );


        geometry.computeVertexNormals();


        // ---------------------------------
        // MATERIAL
        // ---------------------------------


        const material =

            new THREE.MeshStandardMaterial({

                color: 0x8b5a2b,

                roughness: 0.8,

                metalness: 0.0,

                side: THREE.DoubleSide

            });


        // ---------------------------------
        // MALLA
        // ---------------------------------


        troncoMesh =

            new THREE.Mesh(

                geometry,

                material

            );


        scene.add(

            troncoMesh

        );


    }


    // =================================
    // DIBUJAR PERFIL 2D
    // =================================


    function dibujarPerfil(

        sensores

    ) {


        const canvas =

            document.getElementById(

                'profileCanvas'

            );


        const ctx =

            canvas.getContext(

                '2d'

            );


        ctx.clearRect(

            0,

            0,

            canvas.width,

            canvas.height

        );


        if (

            !sensores ||

            sensores.length === 0

        ) {

            return;

        }


        const min =

            Math.min(

                ...sensores

            );


        const max =

            Math.max(

                ...sensores

            );


        const rango =

            max -

            min ||

            1;


        // ---------------------------------
        // PERFIL
        // ---------------------------------


        ctx.beginPath();


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length -

                            1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor -

                            min

                        ) /

                        rango

                    ) *

                    canvas.height;


                if (

                    index === 0

                ) {


                    ctx.moveTo(

                        x,

                        y

                    );

                }

                else {


                    ctx.lineTo(

                        x,

                        y

                    );

                }


            }

        );


        ctx.strokeStyle =

            '#00ffff';


        ctx.lineWidth =

            2;


        ctx.stroke();


        // ---------------------------------
        // PUNTOS
        // ---------------------------------


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length -

                            1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor -

                            min

                        ) /

                        rango

                    ) *

                    canvas.height;


                ctx.beginPath();


                ctx.arc(

                    x,

                    y,

                    3,

                    0,

                    Math.PI *

                    2

                );


                ctx.fillStyle =

                    '#ffffff';


                ctx.fill();


            }

        );


    }


    // =================================
    // ACTUALIZAR DATOS
    // =================================


    async function actualizarDatos() {


        try {


            const response =

                await fetch(

                    '/api/m4000/demo/profile'

                );


            if (

                !response.ok

            ) {


                throw new Error(

                    `HTTP ${response.status}`

                );

            }


            const data =

                await response.json();


            console.log(

                'Respuesta completa:',

                data

            );


            // ---------------------------------
            // VALIDAR RESPUESTA
            // ---------------------------------


            if (

                !data ||

                !Array.isArray(

                    data.profiles

                )

            ) {


                throw new Error(

                    'La respuesta no contiene profiles[]'

                );

            }


            const perfiles =

                data.profiles;


            if (

                perfiles.length === 0

            ) {


                throw new Error(

                    'No hay perfiles disponibles'

                );

            }


            const ultimoPerfil =

                perfiles[

                    perfiles.length -

                    1

                ];


            if (

                !ultimoPerfil ||

                !Array.isArray(

                    ultimoPerfil.sensors

                )

            ) {


                throw new Error(

                    'El último perfil no contiene sensors[]'

                );

            }


            currentData =

                data;


            // ---------------------------------
            // ESTADO
            // ---------------------------------


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: CONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#00ff00';


            // ---------------------------------
            // INFORMACIÓN
            // ---------------------------------


            document.getElementById(

                'angle'

            ).textContent =

                ultimoPerfil.angle;


            document.getElementById(

                'profileCount'

            ).textContent =

                perfiles.length;


            document.getElementById(

                'maxProfiles'

            ).textContent =

                data.totalProfiles || 72;


            document.getElementById(

                'sensorCount'

            ).textContent =

                ultimoPerfil.sensors.length;


            document.getElementById(

                'sensorMin'

            ).textContent =

                Math.min(

                    ...ultimoPerfil.sensors

                );


            document.getElementById(

                'sensorMax'

            ).textContent =

                Math.max(

                    ...ultimoPerfil.sensors

                );


            // ---------------------------------
            // PERFIL 2D
            // ---------------------------------


            dibujarPerfil(

                ultimoPerfil.sensors

            );


            // ---------------------------------
            // SUPERFICIE 3D
            // ---------------------------------


            crearTronco3D(

                perfiles

            );


            document.getElementById(

                'error'

            ).textContent =

                '';


        }


        catch (

            error

        ) {


            console.error(

                'Error leyendo Node-RED:',

                error

            );


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: DESCONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#ff0000';


            document.getElementById(

                'error'

            ).textContent =

                error.message;


        }


    }


    // =================================
    // ANIMACIÓN
    // =================================


    function animate() {


        requestAnimationFrame(

            animate

        );


        controls.update();


        renderer.render(

            scene,

            camera

        );


    }


    animate();


    // =================================
    // REDIMENSIONAR
    // =================================


    window.addEventListener(

        'resize',

        () => {


            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );


        }

    );


    // =================================
    // INICIO
    // =================================


    actualizarDatos();


    setInterval(

        actualizarDatos,

        1000

    );


</script>
