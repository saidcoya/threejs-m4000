```

<!-- ================================= -->
<!-- THREE.JS -->
<!-- ================================= -->

<script type="module">


    import * as THREE from

    'https://unpkg.com/three@0.178.0/build/three.module.js';


    import {

        OrbitControls

    } from

    'https://unpkg.com/three@0.178.0/examples/jsm/controls/OrbitControls.js';


    // =================================
    // VARIABLES
    // =================================


    let currentData = null;


    let profiles = [];


    // =================================
    // ESCENA
    // =================================


    const scene =

        new THREE.Scene();


    scene.background =

        new THREE.Color(

            0x111111

        );


    // =================================
    // CÁMARA
    // =================================


    const camera =

        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /

            window.innerHeight,

            0.1,

            10000

        );


    camera.position.set(

        0,

        0,

        3000

    );


    // =================================
    // RENDERER
    // =================================


    const renderer =

        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.setPixelRatio(

        window.devicePixelRatio

    );


    document.body.appendChild(

        renderer.domElement

    );


    // =================================
    // CONTROLES
    // =================================


    const controls =

        new OrbitControls(

            camera,

            renderer.domElement

        );


    controls.enableDamping = true;


    controls.dampingFactor = 0.05;


    // =================================
    // LUCES
    // =================================


    const ambientLight =

        new THREE.AmbientLight(

            0xffffff,

            1

        );


    scene.add(

        ambientLight

    );


    const directionalLight =

        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    directionalLight.position.set(

        500,

        500,

        500

    );


    scene.add(

        directionalLight

    );


    // =================================
    // GRUPO DEL TRONCO
    // =================================


    const trunkGroup =

        new THREE.Group();


    scene.add(

        trunkGroup

    );


    // =================================
    // DIBUJAR PERFIL 3D
    // =================================


    function dibujarPerfil3D(

        perfiles

    ) {


        // Eliminar geometría anterior


        while (

            trunkGroup.children.length > 0

        ) {


            const objeto =

                trunkGroup.children[0];


            objeto.geometry.dispose();


            objeto.material.dispose();


            trunkGroup.remove(

                objeto

            );

        }


        if (

            !Array.isArray(

                perfiles

            )

            ||

            perfiles.length === 0

        ) {


            return;

        }


        const vertices = [];


        // =================================
        // CONVERTIR CADA PERFIL EN PUNTOS 3D
        // =================================


        perfiles.forEach(

            (

                perfil

            ) => {


                if (

                    !perfil

                    ||

                    !Array.isArray(

                        perfil.sensors

                    )

                ) {


                    return;

                }


                const angleRad =

                    (

                        perfil.angle *

                        Math.PI

                    )

                    /

                    180;


                // Posición longitudinal del perfil


                const z =

                    (

                        perfil.angle /

                        360

                    )

                    *

                    2000;


                perfil.sensors.forEach(

                    (

                        sensor,

                        index

                    ) => {


                        const sensorAngle =

                            (

                                index /

                                perfil.sensors.length

                            )

                            *

                            Math.PI *

                            2;


                        const radio =

                            sensor;


                        const x =

                            Math.cos(

                                sensorAngle

                            )

                            *

                            radio;


                        const y =

                            Math.sin(

                                sensorAngle

                            )

                            *

                            radio;


                        const xRotado =

                            x *

                            Math.cos(

                                angleRad

                            )

                            -

                            y *

                            Math.sin(

                                angleRad

                            );


                        const yRotado =

                            x *

                            Math.sin(

                                angleRad

                            )

                            +

                            y *

                            Math.cos(

                                angleRad

                            );


                        vertices.push(

                            xRotado,

                            yRotado,

                            z

                        );

                    }

                );

            }

        );


        if (

            vertices.length === 0

        ) {


            return;

        }


        // =================================
        // GEOMETRÍA
        // =================================


        const geometry =

            new THREE.BufferGeometry();


        geometry.setAttribute(

            'position',

            new THREE.Float32BufferAttribute(

                vertices,

                3

            )

        );


        // =================================
        // MATERIAL
        // =================================


        const material =

            new THREE.PointsMaterial({

                color: 0x00ffff,

                size: 12,

                sizeAttenuation: true

            });


        // =================================
        // NUBE DE PUNTOS
        // =================================


        const points =

            new THREE.Points(

                geometry,

                material

            );


        trunkGroup.add(

            points

        );


        // =================================
        // CENTRAR OBJETO
        // =================================


        geometry.computeBoundingSphere();


        if (

            geometry.boundingSphere

        ) {


            controls.target.copy(

                geometry.boundingSphere.center

            );


            camera.lookAt(

                geometry.boundingSphere.center

            );

        }

    }


    // =================================
    // DIBUJAR PERFIL 2D
    // =================================


    function dibujarPerfil2D(

        sensores

    ) {


        const canvas =

            document.getElementById(

                'profileCanvas'

            );


        const ctx =

            canvas.getContext(

                '2d'

            );


        ctx.clearRect(

            0,

            0,

            canvas.width,

            canvas.height

        );


        if (

            !Array.isArray(

                sensores

            )

            ||

            sensores.length === 0

        ) {


            return;

        }


        const min =

            Math.min(

                ...sensores

            );


        const max =

            Math.max(

                ...sensores

            );


        const rango =

            max -

            min

            ||

            1;


        ctx.beginPath();


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length -

                            1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor -

                            min

                        )

                        /

                        rango

                    )

                    *

                    canvas.height;


                if (

                    index === 0

                ) {


                    ctx.moveTo(

                        x,

                        y

                    );

                }

                else {


                    ctx.lineTo(

                        x,

                        y

                    );

                }

            }

        );


        ctx.strokeStyle =

            '#00ffff';


        ctx.lineWidth =

            2;


        ctx.stroke();


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length -

                            1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor -

                            min

                        )

                        /

                        rango

                    )

                    *

                    canvas.height;


                ctx.beginPath();


                ctx.arc(

                    x,

                    y,

                    3,

                    0,

                    Math.PI *

                    2

                );


                ctx.fillStyle =

                    '#ffffff';


                ctx.fill();

            }

        );

    }


    // =================================
    // ACTUALIZAR DATOS
    // =================================


    async function actualizarDatos() {


        try {


            const response =

                await fetch(

                    '/api/m4000/demo/profile'

                );


            if (

                !response.ok

            ) {


                throw new Error(

                    `HTTP ${response.status}`

                );

            }


            const data =

                await response.json();


            console.log(

                'RESPUESTA COMPLETA:',

                data

            );


            console.log(

                'CLAVES RECIBIDAS:',

                Object.keys(

                    data

                )

            );


            // =================================
            // COMPROBAR ARRAY DE PERFILES
            // =================================


            if (

                !data

                ||

                !Array.isArray(

                    data.profiles

                )

            ) {


                throw new Error(

                    'La respuesta no contiene un array profiles válido'

                );

            }


            currentData =

                data;


            profiles =

                data.profiles;


            // =================================
            // ÚLTIMO PERFIL
            // =================================


            const ultimoPerfil =

                profiles[

                    profiles.length -

                    1

                ];


            if (

                !ultimoPerfil

                ||

                !Array.isArray(

                    ultimoPerfil.sensors

                )

            ) {


                throw new Error(

                    'El último perfil no contiene un array sensors válido'

                );

            }


            // =================================
            // ESTADO
            // =================================


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: CONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#00ff00';


            // =================================
            // DATOS
            // =================================


            document.getElementById(

                'angle'

            ).textContent =

                ultimoPerfil.angle;


            document.getElementById(

                'profileCount'

            ).textContent =

                profiles.length +

                ' / 32';


            document.getElementById(

                'sensorCount'

            ).textContent =

                ultimoPerfil.sensors.length;


            document.getElementById(

                'sensorMin'

            ).textContent =

                Math.min(

                    ...ultimoPerfil.sensors

                );


            document.getElementById(

                'sensorMax'

            ).textContent =

                Math.max(

                    ...ultimoPerfil.sensors

                );


            // =================================
            // DIBUJAR 3D
            // =================================


            dibujarPerfil3D(

                profiles

            );


            // =================================
            // DIBUJAR 2D
            // =================================


            dibujarPerfil2D(

                ultimoPerfil.sensors

            );


            document.getElementById(

                'error'

            ).textContent =

                '';


        }


        catch (

            error

        ) {


            console.error(

                'Error leyendo Node-RED:',

                error

            );


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: DESCONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#ff0000';


            document.getElementById(

                'error'

            ).textContent =

                error.message;

        }

    }


    // =================================
    // ANIMACIÓN
    // =================================


    function animate() {


        requestAnimationFrame(

            animate

        );


        controls.update();


        renderer.render(

            scene,

            camera

        );

    }


    animate();


    // =================================
    // REDIMENSIONAR
    // =================================


    window.addEventListener(

        'resize',

        () => {


            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }

    );


    // =================================
    // INICIO
    // =================================


    actualizarDatos();


    setInterval(

        actualizarDatos,

        1000

    );


</script>
