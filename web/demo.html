<!-- ================================= -->
<!-- THREE.JS -->

<script type="module">


    import * as THREE from

    'https://unpkg.com/three@0.178.0/build/three.module.js';



    // =================================
    // CONFIGURACIÓN
    // =================================


    const MAX_PROFILES = 32;


    const SENSOR_COUNT = 32;


    const API_URL =

        '/api/m4000/demo/profile';



    // =================================
    // VARIABLES
    // =================================


    let perfiles = [];


    let currentData = null;


    let troncoMesh = null;



    // =================================
    // ESCENA
    // =================================


    const scene =

        new THREE.Scene();


    scene.background =

        new THREE.Color(

            0x111111

        );



    // =================================
    // CÁMARA
    // =================================


    const camera =

        new THREE.PerspectiveCamera(

            60,

            window.innerWidth /

            window.innerHeight,

            0.1,

            10000

        );


    camera.position.set(

        0,

        0,

        3500

    );


    camera.lookAt(

        0,

        0,

        0

    );



    // =================================
    // RENDERER
    // =================================


    const renderer =

        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.setPixelRatio(

        window.devicePixelRatio

    );


    document.body.appendChild(

        renderer.domElement

    );



    // =================================
    // LUCES
    // =================================


    const ambientLight =

        new THREE.AmbientLight(

            0xffffff,

            1.5

        );


    scene.add(

        ambientLight

    );


    const directionalLight =

        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    directionalLight.position.set(

        3000,

        3000,

        3000

    );


    scene.add(

        directionalLight

    );



    // =================================
    // GRUPO DEL TRONCO
    // =================================


    const troncoGroup =

        new THREE.Group();


    scene.add(

        troncoGroup

    );



    // =================================
    // CREAR PERFIL 2D
    // =================================


    function dibujarPerfil(

        sensores

    ) {


        const canvas =

            document.getElementById(

                'profileCanvas'

            );


        const ctx =

            canvas.getContext(

                '2d'

            );


        ctx.clearRect(

            0,

            0,

            canvas.width,

            canvas.height

        );


        if (

            !sensores ||

            sensores.length === 0

        ) {

            return;

        }


        const min =

            Math.min(

                ...sensores

            );


        const max =

            Math.max(

                ...sensores

            );


        const rango =

            max - min || 1;


        ctx.beginPath();


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length - 1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor - min

                        ) /

                        rango

                    )

                    *

                    canvas.height;


                if (

                    index === 0

                ) {

                    ctx.moveTo(

                        x,

                        y

                    );

                }

                else {

                    ctx.lineTo(

                        x,

                        y

                    );

                }

            }

        );


        ctx.strokeStyle =

            '#00ffff';


        ctx.lineWidth =

            2;


        ctx.stroke();


        sensores.forEach(

            (

                valor,

                index

            ) => {


                const x =

                    index *

                    (

                        canvas.width /

                        (

                            sensores.length - 1

                        )

                    );


                const y =

                    canvas.height -

                    (

                        (

                            valor - min

                        ) /

                        rango

                    )

                    *

                    canvas.height;


                ctx.beginPath();


                ctx.arc(

                    x,

                    y,

                    3,

                    0,

                    Math.PI * 2

                );


                ctx.fillStyle =

                    '#ffffff';


                ctx.fill();

            }

        );

    }



    // =================================
    // CREAR SUPERFICIE 3D
    // =================================


    function crearTronco3D() {


        if (

            perfiles.length < 2

        ) {

            return;

        }


        // Eliminar malla anterior


        if (

            troncoMesh

        ) {


            troncoGroup.remove(

                troncoMesh

            );


            troncoMesh.geometry.dispose();


            troncoMesh.material.dispose();


        }



        const geometry =

            new THREE.BufferGeometry();



        const vertices = [];


        const indices = [];



        // =================================
        // GENERAR VÉRTICES
        // =================================


        perfiles.forEach(

            (

                perfil,

                perfilIndex

            ) => {


                const anguloEje =

                    (

                        perfilIndex /

                        (

                            MAX_PROFILES - 1

                        )

                    )

                    *

                    Math.PI *

                    2;


                const cosEje =

                    Math.cos(

                        anguloEje

                    );


                const sinEje =

                    Math.sin(

                        anguloEje

                    );


                perfil.sensors.forEach(

                    (

                        distancia,

                        sensorIndex

                    ) => {


                        const anguloSensor =

                            (

                                sensorIndex /

                                SENSOR_COUNT

                            )

                            *

                            Math.PI *

                            2;


                        const radio =

                            distancia;



                        const x =

                            radio *

                            Math.cos(

                                anguloSensor

                            );


                        const y =

                            radio *

                            Math.sin(

                                anguloSensor

                            );


                        const z =

                            perfilIndex *

                            150;



                        vertices.push(

                            x,

                            y,

                            z

                        );

                    }

                );

            }

        );



        // =================================
        // CREAR TRIÁNGULOS
        // =================================


        for (

            let p = 0;

            p < perfiles.length - 1;

            p++

        ) {


            for (

                let s = 0;

                s < SENSOR_COUNT;

                s++

            ) {


                const siguienteSensor =

                    (

                        s + 1

                    )

                    %

                    SENSOR_COUNT;


                const a =

                    p *

                    SENSOR_COUNT +

                    s;


                const b =

                    p *

                    SENSOR_COUNT +

                    siguienteSensor;


                const c =

                    (

                        p + 1

                    )

                    *

                    SENSOR_COUNT +

                    siguienteSensor;


                const d =

                    (

                        p + 1

                    )

                    *

                    SENSOR_COUNT +

                    s;



                indices.push(

                    a,

                    b,

                    d

                );


                indices.push(

                    b,

                    c,

                    d

                );

            }

        }



        geometry.setAttribute(

            'position',

            new THREE.Float32BufferAttribute(

                vertices,

                3

            )

        );


        geometry.setIndex(

            indices

        );


        geometry.computeVertexNormals();



        const material =

            new THREE.MeshStandardMaterial({

                color: 0x8b4513,

                roughness: 0.8,

                metalness: 0.1,

                side: THREE.DoubleSide

            });



        troncoMesh =

            new THREE.Mesh(

                geometry,

                material

            );


        troncoGroup.add(

            troncoMesh

        );



        // =================================
        // CENTRAR OBJETO
        // =================================


        troncoGroup.position.z =

            -

            (

                perfiles.length *

                150

            )

            /

            2;



        troncoGroup.rotation.x =

            0.4;


        troncoGroup.rotation.y =

            0.4;

    }



    // =================================
    // ACTUALIZAR DATOS
    // =================================


    async function actualizarDatos() {


        try {


            const response =

                await fetch(

                    API_URL +

                    '?t=' +

                    Date.now()

                );


            if (

                !response.ok

            ) {


                throw new Error(

                    `HTTP ${response.status}`

                );

            }

            const data = await response.json();

            console.log("RESPUESTA COMPLETA:", data);
            console.log("CLAVES RECIBIDAS:", Object.keys(data));
            console.log("data.sensors:", data.sensors);

            currentData =

                data;



            // =================================
            // VALIDAR DATOS
            // =================================


            if (

                !data.sensors ||

                !Array.isArray(

                    data.sensors

                )

            ) {


                throw new Error(

                    'El perfil no contiene un array sensors válido'

                );

            }



            // =================================
            // EVITAR DUPLICADOS
            // =================================


            const ultimoPerfil =

                perfiles[

                    perfiles.length - 1

                ];


            if (

                !ultimoPerfil ||

                ultimoPerfil.timestamp !==

                data.timestamp

            ) {


                perfiles.push(

                    data

                );

            }



            // =================================
            // MANTENER SOLO 32 PERFILES
            // =================================


            if (

                perfiles.length >

                MAX_PROFILES

            ) {


                perfiles.shift();

            }



            // =================================
            // INFORMACIÓN
            // =================================


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: CONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#00ff00';



            document.getElementById(

                'angle'

            ).textContent =

                data.angle;



            document.getElementById(

                'profileCount'

            ).textContent =

                perfiles.length;



            document.getElementById(

                'sensorCount'

            ).textContent =

                data.sensors.length;



            document.getElementById(

                'sensorMin'

            ).textContent =

                Math.min(

                    ...data.sensors

                );



            document.getElementById(

                'sensorMax'

            ).textContent =

                Math.max(

                    ...data.sensors

                );



            // =================================
            // DIBUJAR PERFIL 2D
            // =================================


            dibujarPerfil(

                data.sensors

            );



            // =================================
            // ACTUALIZAR 3D
            // =================================


            crearTronco3D();



            document.getElementById(

                'error'

            ).textContent =

                '';

        }


        catch (

            error

        ) {


            console.error(

                'Error leyendo Node-RED:',

                error

            );


            document.getElementById(

                'status'

            ).textContent =

                'Node-RED: DESCONECTADO';


            document.getElementById(

                'status'

            ).style.color =

                '#ff0000';


            document.getElementById(

                'error'

            ).textContent =

                error.message;

        }

    }



    // =================================
    // ROTACIÓN AUTOMÁTICA
    // =================================


    function animate() {


        requestAnimationFrame(

            animate

        );


        troncoGroup.rotation.z +=

            0.002;


        renderer.render(

            scene,

            camera

        );

    }


    animate();



    // =================================
    // REDIMENSIONAR
    // =================================


    window.addEventListener(

        'resize',

        () => {


            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );

        }

    );



    // =================================
    // INICIO
    // =================================


    actualizarDatos();


    setInterval(

        actualizarDatos,

        1000

    );


</script>
