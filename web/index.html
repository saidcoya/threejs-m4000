<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M4000 Industrial Dashboard</title>

<style>

:root {

    --bg: #0b0f14;
    --panel: #121820;
    --panel-light: #18212b;
    --border: #263442;
    --text: #e6edf3;
    --muted: #8b9aaa;
    --green: #00d084;
    --red: #ff4d5a;
    --yellow: #ffb020;
    --blue: #25a7ff;
    --cyan: #00d9ff;

}

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family:

        "Segoe UI",

        Arial,

        sans-serif;

}


/* =====================================
   BARRA SUPERIOR
===================================== */

.topbar {

    height: 64px;

    background: #0e141b;

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 24px;

}


.logo {

    font-size: 20px;

    font-weight: 700;

    letter-spacing: 1px;

}


.logo span {

    color: var(--cyan);

}


.nav {

    display: flex;

    gap: 8px;

}


.nav button {

    background: transparent;

    color: var(--muted);

    border: 1px solid transparent;

    padding: 10px 16px;

    border-radius: 6px;

    cursor: pointer;

    font-weight: 600;

}


.nav button:hover,

.nav button.active {

    color: white;

    background: var(--panel-light);

    border-color: var(--border);

}


.connection {

    display: flex;

    align-items: center;

    gap: 8px;

    color: var(--muted);

    font-size: 13px;

}


.connection-dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: var(--red);

}


.connection-dot.ok {

    background: var(--green);

}


/* =====================================
   CONTENEDOR
===================================== */

.container {

    padding: 24px;

    max-width: 1800px;

    margin: auto;

}


.page-title {

    margin-bottom: 20px;

}


.page-title h1 {

    margin: 0;

    font-size: 26px;

}


.page-title p {

    margin: 6px 0 0;

    color: var(--muted);

}


/* =====================================
   GRID
===================================== */

.grid {

    display: grid;

    grid-template-columns:

        repeat(

            auto-fit,

            minmax(

                280px,

                1fr

            )

        );

    gap: 18px;

}


/* =====================================
   PANEL
===================================== */

.panel {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 18px;

}


.panel h2 {

    margin: 0 0 16px;

    font-size: 16px;

    color: var(--text);

}


.panel-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 16px;

}


.badge {

    font-size: 11px;

    padding: 4px 8px;

    border-radius: 4px;

    background: #202b36;

    color: var(--muted);

}


/* =====================================
   ENTRADAS / SALIDAS
===================================== */

.io-grid {

    display: grid;

    grid-template-columns:

        repeat(

            4,

            1fr

        );

    gap: 8px;

}


.io-item {

    background: #0d1319;

    border: 1px solid var(--border);

    border-radius: 6px;

    padding: 10px;

    text-align: center;

}


.io-label {

    font-size: 11px;

    color: var(--muted);

    margin-bottom: 6px;

}


.io-state {

    font-size: 13px;

    font-weight: 700;

}


.io-state.on {

    color: var(--green);

}


.io-state.off {

    color: var(--red);

}


/* =====================================
   SALIDAS CONTROLABLES
===================================== */

.do-grid {

    display: grid;

    grid-template-columns:

        repeat(

            4,

            1fr

        );

    gap: 8px;

}


.do-item {

    background: #0d1319;

    border: 1px solid var(--border);

    border-radius: 6px;

    padding: 10px;

}


.do-name {

    font-size: 12px;

    color: var(--muted);

    margin-bottom: 8px;

}


.do-button {

    width: 100%;

    border: none;

    border-radius: 5px;

    padding: 8px;

    cursor: pointer;

    font-weight: bold;

    background: #27313b;

    color: var(--muted);

}


.do-button.on {

    background: var(--green);

    color: #07110d;

}


.do-button:hover {

    opacity: 0.85;

}


/* =====================================
   ANALÓGICAS
===================================== */

.ai-grid {

    display: grid;

    grid-template-columns:

        repeat(

            2,

            1fr

        );

    gap: 12px;

}


.ai-card {

    background: #0d1319;

    border: 1px solid var(--border);

    border-radius: 8px;

    padding: 16px;

}


.ai-label {

    color: var(--muted);

    font-size: 12px;

}


.ai-value {

    font-size: 28px;

    font-weight: 700;

    margin-top: 8px;

    color: var(--cyan);

}


.ai-unit {

    color: var(--muted);

    font-size: 12px;

}


/* =====================================
   RESPONSIVE
===================================== */

@media (

    max-width: 800px

) {


    .topbar {

        padding: 0 12px;

    }


    .nav button {

        padding: 8px;

        font-size: 11px;

    }


    .container {

        padding: 14px;

    }


    .io-grid,

    .do-grid {

        grid-template-columns:

            repeat(

                2,

                1fr

            );

    }

}

</style>

</head>

<body>

<header class="topbar">

```
<div class="logo">

    M4000 <span>INDUSTRIAL</span>

</div>


<nav class="nav">


    <button

        class="active"

        onclick="location.href='index.html'">

        Dashboard

    </button>


    <button

        onclick="location.href='demo-troncos.html'">

        Demo Troncos

    </button>


    <button

        onclick="location.href='demo-template.html'">

        Más demos

    </button>


</nav>


<div class="connection">


    <div

        id="connectionDot"

        class="connection-dot">

    </div>


    <span

        id="connectionText">

        DESCONECTADO

    </span>


</div>
```

</header>

<main class="container">

```
<div class="page-title">


    <h1>

        Dashboard de control

    </h1>


    <p>

        Monitorización de entradas, salidas y señales analógicas

    </p>


</div>


<div class="grid">


    <!-- DI -->


    <section class="panel">


        <div class="panel-header">


            <h2>

                Entradas digitales

            </h2>


            <span class="badge">

                DI 0-15

            </span>


        </div>


        <div

            id="diGrid"

            class="io-grid">

        </div>


    </section>


    <!-- DO -->


    <section class="panel">


        <div class="panel-header">


            <h2>

                Salidas digitales

            </h2>


            <span class="badge">

                DO 0-15

            </span>


        </div>


        <div

            id="doGrid"

            class="do-grid">

        </div>


    </section>


    <!-- AI -->


    <section class="panel">


        <div class="panel-header">


            <h2>

                Entradas analógicas

            </h2>


            <span class="badge">

                AI

            </span>


        </div>


        <div

            id="aiGrid"

            class="ai-grid">

        </div>


    </section>


</div>
```

</main>

<script>


const STATUS_URL =

    '/api/m4000/status';


const DO_URL =

    '/api/m4000/do';


const diGrid =

    document.getElementById(

        'diGrid'

    );


const doGrid =

    document.getElementById(

        'doGrid'

    );


const aiGrid =

    document.getElementById(

        'aiGrid'

    );


/* =====================================
   CREAR DI
===================================== */

for (

    let i = 0;

    i < 16;

    i++

) {


    diGrid.innerHTML += `

        <div class="io-item">

            <div class="io-label">

                DI${i}

            </div>

            <div

                id="di-${i}"

                class="io-state off">

                OFF

            </div>

        </div>

    `;

}


/* =====================================
   CREAR DO
===================================== */

for (

    let i = 0;

    i < 16;

    i++

) {


    doGrid.innerHTML += `

        <div class="do-item">

            <div class="do-name">

                DO${i}

            </div>

            <button

                id="do-${i}"

                class="do-button"

                onclick="toggleDO(${i})">

                OFF

            </button>

        </div>

    `;

}


/* =====================================
   CREAR AI
===================================== */

for (

    let i = 0;

    i < 4;

    i++

) {


    aiGrid.innerHTML += `

        <div class="ai-card">

            <div class="ai-label">

                AI${i}

            </div>

            <div

                id="ai-${i}"

                class="ai-value">

                ---

            </div>

            <div class="ai-unit">

                Valor actual

            </div>

        </div>

    `;

}


/* =====================================
   ACTUALIZAR
===================================== */

async function actualizarDatos() {


    try {


        const response =

            await fetch(

                STATUS_URL +

                '?t=' +

                Date.now()

            );


        if (

            !response.ok

        ) {


            throw new Error(

                'HTTP ' +

                response.status

            );

        }


        const data =

            await response.json();


        document.getElementById(

            'connectionDot'

        ).classList.add(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'CONECTADO';


        for (

            let i = 0;

            i < 16;

            i++

        ) {


            const estado =

                Boolean(

                    data.DI?.[i]

                );


            const elemento =

                document.getElementById(

                    `di-${i}`

                );


            elemento.textContent =

                estado ?

                'ON' :

                'OFF';


            elemento.className =

                estado ?

                'io-state on' :

                'io-state off';

        }


        for (

            let i = 0;

            i < 16;

            i++

        ) {


            const estado =

                Boolean(

                    data.DO?.[i]

                );


            const boton =

                document.getElementById(

                    `do-${i}`

                );


            boton.textContent =

                estado ?

                'ON' :

                'OFF';


            boton.className =

                estado ?

                'do-button on' :

                'do-button';

        }


        for (

            let i = 0;

            i < 4;

            i++

        ) {


            document.getElementById(

                `ai-${i}`

            ).textContent =

                data.AI?.[i] ??

                '---';

        }


    }


    catch (

        error

    ) {


        document.getElementById(

            'connectionDot'

        ).classList.remove(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'DESCONECTADO';

    }

}


/* =====================================
   ESCRIBIR DO
===================================== */

async function toggleDO(

    channel

) {


    const boton =

        document.getElementById(

            `do-${channel}`

        );


    const nuevoEstado =

        !boton.classList.contains(

            'on'

        );


    try {


        await fetch(

            DO_URL,

            {

                method: 'POST',

                headers: {

                    'Content-Type':

                        'application/json'

                },

                body: JSON.stringify({

                    channel:

                        channel,

                    value:

                        nuevoEstado

                })

            }

        );


        await actualizarDatos();


    }


    catch (

        error

    ) {


        console.error(

            error

        );

    }

}


/* =====================================
   INICIO
===================================== */

actualizarDatos();


setInterval(

    actualizarDatos,

    1000

);

</script>

</body>

</html>
