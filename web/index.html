<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Three.js M4000</title>

    <style>

        body {

            margin: 0;

            overflow: hidden;

            background: #111;

        }


        #info {

            position: absolute;

            top: 15px;

            left: 15px;

            color: white;

            font-family: Arial;

            z-index: 10;

            background: rgba(0, 0, 0, 0.7);

            padding: 15px;

            border-radius: 5px;

            line-height: 1.6;

        }

    </style>

</head>


<body>


    <div id="info">

        Three.js M4000<br>

        WebSocket:

        <span id="connection">

            CONECTANDO...

        </span>

        <br>

        DO3:

        <span id="do3">

            ---

        </span>

        <br>

        AI0:

        <span id="ai0">

            ---

        </span>

    </div>


    <script type="module">


        // =================================
        // IMPORTAR THREE.JS
        // =================================

        import * as THREE from

        'https://unpkg.com/three@0.178.0/build/three.module.js';



        // =================================
        // ESCENA
        // =================================

        const scene =

            new THREE.Scene();



        // =================================
        // CÁMARA
        // =================================

        const camera =

            new THREE.PerspectiveCamera(

                75,

                window.innerWidth /

                window.innerHeight,

                0.1,

                1000

            );


        camera.position.z = 5;



        // =================================
        // RENDERER
        // =================================

        const renderer =

            new THREE.WebGLRenderer({

                antialias: true

            });


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );


        document.body.appendChild(

            renderer.domElement

        );



        // =================================
        // CUBO 3D
        // =================================

        const geometry =

            new THREE.BoxGeometry(

                2,

                2,

                2

            );


        const material =

            new THREE.MeshStandardMaterial({

                color: 0x00ff00

            });


        const cube =

            new THREE.Mesh(

                geometry,

                material

            );


        scene.add(cube);



        // =================================
        // LUZ
        // =================================

        const light =

            new THREE.DirectionalLight(

                0xffffff,

                3

            );


        light.position.set(

            5,

            5,

            5

        );


        scene.add(light);



        // =================================
        // WEBSOCKET NODE-RED
        // =================================

        const socket =

            new WebSocket(

                'wss://192.168.1.211/u-os-app-node-red-host/red/ws/m4000'

            );



        // =================================
        // WEBSOCKET CONECTADO
        // =================================

        socket.onopen = function () {


            console.log(

                'WebSocket conectado a Node-RED'

            );


            document.getElementById(

                'connection'

            ).textContent =

                'CONECTADO';


        };



        // =================================
        // DATOS RECIBIDOS
        // =================================

        socket.onmessage = function (event) {


            console.log(

                'Datos recibidos desde Node-RED:',

                event.data

            );


            let data;


            try {


                data =

                    JSON.parse(

                        event.data

                    );


            }

            catch (error) {


                console.error(

                    'Error al interpretar JSON:',

                    error

                );


                return;


            }



            // =============================
            // LEER DO3
            // =============================

            const do3 =

                Boolean(

                    data.DO?.[3]

                );



            // =============================
            // LEER AI0
            // =============================

            const ai0 =

                data.AI?.[0];



            // =============================
            // MOSTRAR DO3
            // =============================

            document.getElementById(

                'do3'

            ).textContent =

                do3;



            // =============================
            // MOSTRAR AI0
            // =============================

            document.getElementById(

                'ai0'

            ).textContent =

                ai0;



            // =============================
            // CONTROLAR CUBO CON DO3
            // =============================

            if (

                do3 === true

            ) {


                cube.rotation.x +=

                    0.05;


                cube.rotation.y +=

                    0.05;


            }


        };



        // =================================
        // ERROR WEBSOCKET
        // =================================

        socket.onerror = function (error) {


            console.error(

                'Error WebSocket:',

                error

            );


            document.getElementById(

                'connection'

            ).textContent =

                'ERROR';


        };



        // =================================
        // WEBSOCKET CERRADO
        // =================================

        socket.onclose = function () {


            console.log(

                'WebSocket desconectado'

            );


            document.getElementById(

                'connection'

            ).textContent =

                'DESCONECTADO';


        };



        // =================================
        // ANIMACIÓN
        // =================================

        function animate() {


            requestAnimationFrame(

                animate

            );


            // Rotación continua

            cube.rotation.x +=

                0.01;


            cube.rotation.y +=

                0.01;


            renderer.render(

                scene,

                camera

            );


        }


        animate();



        // =================================
        // REDIMENSIONAR VENTANA
        // =================================

        window.addEventListener(

            'resize',

            () => {


                camera.aspect =

                    window.innerWidth /

                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight

                );


            }

        );


    </script>


</body>

</html>
