<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M4000 Industrial Dashboard</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>

/* ================================= */
/* CONFIGURACIÓN GENERAL */
/* ================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #111820;

    color: #e6edf3;

    font-family: Arial, Helvetica, sans-serif;

    overflow-x: hidden;

}


/* ================================= */
/* CABECERA */
/* ================================= */

.header {

    height: 65px;

    background: #18232d;

    border-bottom: 1px solid #344452;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 25px;

}


.header h1 {

    margin: 0;

    font-size: 22px;

    letter-spacing: 1px;

}


.connection {

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 14px;

}


.connection-led {

    width: 13px;

    height: 13px;

    border-radius: 50%;

    background: #d32f2f;

}


.connection-led.ok {

    background: #00c853;

}


/* ================================= */
/* CONTENEDOR PRINCIPAL */
/* ================================= */

.container {

    padding: 20px;

}


/* ================================= */
/* SECCIONES */
/* ================================= */

.section {

    background: #18232d;

    border: 1px solid #344452;

    border-radius: 8px;

    padding: 18px;

    margin-bottom: 20px;

}


.section-title {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 15px;

    color: #9fb3c8;

    border-bottom: 1px solid #344452;

    padding-bottom: 10px;

}


/* ================================= */
/* GRID */
/* ================================= */

.io-grid {

    display: grid;

    grid-template-columns:

        repeat(

            8,

            minmax(

                100px,

                1fr

            )

        );

    gap: 12px;

}


@media (

    max-width: 1000px

) {

    .io-grid {

        grid-template-columns:

            repeat(

                4,

                1fr

            );

    }

}


@media (

    max-width: 600px

) {

    .io-grid {

        grid-template-columns:

            repeat(

                2,

                1fr

            );

    }

}


/* ================================= */
/* DI */
/* ================================= */

.io-card {

    background: #202d38;

    border: 1px solid #3a4b59;

    border-radius: 6px;

    padding: 12px;

    text-align: center;

}


.io-label {

    font-size: 13px;

    color: #aab7c4;

    margin-bottom: 8px;

}


.led {

    width: 24px;

    height: 24px;

    margin: auto;

    border-radius: 50%;

    background: #424b52;

    box-shadow:

        0 0 4px

        rgba(

            0,

            0,

            0,

            0.8

        );

}


.led.on {

    background: #00e676;

    box-shadow:

        0 0 12px

        #00e676;

}


.led.do-on {

    background: #ff9800;

    box-shadow:

        0 0 12px

        #ff9800;

}


/* ================================= */
/* BOTONES DO */
/* ================================= */

.do-button {

    width: 100%;

    border: none;

    border-radius: 5px;

    padding: 10px 5px;

    background: #263640;

    color: #cfd8dc;

    cursor: pointer;

    font-weight: bold;

}


.do-button:hover {

    background: #354b59;

}


.do-button.on {

    background: #b86b00;

    color: white;

}


/* ================================= */
/* ANALÓGICAS */
/* ================================= */

.ai-grid {

    display: grid;

    grid-template-columns:

        repeat(

            4,

            1fr

        );

    gap: 15px;

}


@media (

    max-width: 900px

) {

    .ai-grid {

        grid-template-columns:

            repeat(

                2,

                1fr

            );

    }

}


@media (

    max-width: 600px

) {

    .ai-grid {

        grid-template-columns:

            1fr

        ;

    }

}


.ai-card {

    background: #202d38;

    border: 1px solid #3a4b59;

    border-radius: 8px;

    padding: 15px;

}


.ai-title {

    color: #9fb3c8;

    font-size: 14px;

}


.ai-value {

    font-size: 28px;

    font-weight: bold;

    margin-top: 8px;

    color: #00bcd4;

}


.ai-bar {

    height: 10px;

    background: #303d48;

    border-radius: 5px;

    overflow: hidden;

    margin-top: 12px;

}


.ai-fill {

    height: 100%;

    width: 0%;

    background: #00bcd4;

    transition: width 0.3s;

}


.ai-chart {

    height: 160px;

    margin-top: 10px;

}


/* ================================= */
/* ESTADO */
/* ================================= */

.status-bar {

    display: flex;

    justify-content: space-between;

    flex-wrap: wrap;

    gap: 15px;

    color: #9fb3c8;

    font-size: 13px;

}


</style>

</head>

<body>

<!-- ================================= -->

<!-- CABECERA -->

<!-- ================================= -->

<header class="header">

```
<h1>

    M4000 INDUSTRIAL DASHBOARD

</h1>


<div class="connection">

    <div

        id="connectionLed"

        class="connection-led">

    </div>


    <span

        id="connectionText">

        NODE-RED DESCONECTADO

    </span>

</div>
```

</header>

<div class="container">

<!-- ================================= -->

<!-- ENTRADAS DIGITALES -->

<!-- ================================= -->

<section class="section">

```
<div class="section-title">

    ENTRADAS DIGITALES — DI0 ... DI15

</div>


<div

    id="diGrid"

    class="io-grid">

</div>
```

</section>

<!-- ================================= -->

<!-- SALIDAS DIGITALES -->

<!-- ================================= -->

<section class="section">

```
<div class="section-title">

    SALIDAS DIGITALES — DO0 ... DO15

</div>


<div

    id="doGrid"

    class="io-grid">

</div>
```

</section>

<!-- ================================= -->

<!-- ANALÓGICAS -->

<!-- ================================= -->

<section class="section">

```
<div class="section-title">

    ENTRADAS ANALÓGICAS

</div>


<div

    id="aiGrid"

    class="ai-grid">

</div>
```

</section>

<!-- ================================= -->

<!-- ESTADO -->

<!-- ================================= -->

<section class="section">

```
<div class="status-bar">


    <span>

        Última actualización:

        <b id="lastUpdate">

            ---

        </b>

    </span>


    <span>

        DI activos:

        <b id="diActive">

            0

        </b>

    </span>


    <span>

        DO activos:

        <b id="doActive">

            0

        </b>

    </span>


</div>
```

</section>

</div>

<script>


// =====================================
// CONFIGURACIÓN
// =====================================


const STATUS_URL =

    '/api/m4000/status';


const DO_URL =

    '/api/m4000/do';


const NUM_DI = 16;


const NUM_DO = 16;


const NUM_AI = 4;


const MAX_HISTORY = 60;


// =====================================
// HISTÓRICO ANALÓGICAS
// =====================================


const aiHistory = [];


for (

    let i = 0;

    i < NUM_AI;

    i++

) {

    aiHistory.push([]);

}


// =====================================
// CREAR DI
// =====================================


function crearDI() {


    const grid =

        document.getElementById(

            'diGrid'

        );


    for (

        let i = 0;

        i < NUM_DI;

        i++

    ) {


        const card =

            document.createElement(

                'div'

            );


        card.className =

            'io-card';


        card.innerHTML = `

            <div class="io-label">

                DI${i}

            </div>

            <div

                id="diLed${i}"

                class="led">

            </div>

        `;


        grid.appendChild(

            card

        );

    }

}


// =====================================
// CREAR DO
// =====================================


function crearDO() {


    const grid =

        document.getElementById(

            'doGrid'

        );


    for (

        let i = 0;

        i < NUM_DO;

        i++

    ) {


        const card =

            document.createElement(

                'div'

            );


        card.className =

            'io-card';


        card.innerHTML = `

            <div class="io-label">

                DO${i}

            </div>

            <button

                id="doButton${i}"

                class="do-button"

                data-channel="${i}">

                OFF

            </button>

        `;


        grid.appendChild(

            card

        );


        card.querySelector(

            'button'

        ).addEventListener(

            'click',

            () => {


                const estado =

                    card

                    .querySelector(

                        'button'

                    )

                    .classList

                    .contains(

                        'on'

                    );


                escribirDO(

                    i,

                    !estado

                );


            }

        );

    }

}


// =====================================
// CREAR AI
// =====================================


function crearAI() {


    const grid =

        document.getElementById(

            'aiGrid'

        );


    for (

        let i = 0;

        i < NUM_AI;

        i++

    ) {


        const card =

            document.createElement(

                'div'

            );


        card.className =

            'ai-card';


        card.innerHTML = `

            <div class="ai-title">

                AI${i}

            </div>


            <div

                id="aiValue${i}"

                class="ai-value">

                ---

            </div>


            <div class="ai-bar">

                <div

                    id="aiFill${i}"

                    class="ai-fill">

                </div>

            </div>


            <div

                id="aiChart${i}"

                class="ai-chart">

            </div>

        `;


        grid.appendChild(

            card

        );


        Plotly.newPlot(

            `aiChart${i}`,

            [

                {

                    y: [],

                    mode: 'lines',

                    line: {

                        width: 2

                    }

                }

            ],

            {

                margin: {

                    t: 5,

                    r: 5,

                    b: 20,

                    l: 35

                },

                paper_bgcolor:

                    'rgba(0,0,0,0)',

                plot_bgcolor:

                    'rgba(0,0,0,0)',

                xaxis: {

                    visible: false

                },

                yaxis: {

                    gridcolor: '#344452'

                }

            },

            {

                displayModeBar: false,

                responsive: true

            }

        );

    }

}


// =====================================
// ACTUALIZAR DI
// =====================================


function actualizarDI(

    valores

) {


    let activos = 0;


    for (

        let i = 0;

        i < NUM_DI;

        i++

    ) {


        const estado =

            Boolean(

                valores?.[i]

            );


        const led =

            document.getElementById(

                `diLed${i}`

            );


        led.classList.toggle(

            'on',

            estado

        );


        if (

            estado

        ) {

            activos++;

        }

    }


    document.getElementById(

        'diActive'

    ).textContent =

        activos;

}


// =====================================
// ACTUALIZAR DO
// =====================================


function actualizarDO(

    valores

) {


    let activos = 0;


    for (

        let i = 0;

        i < NUM_DO;

        i++

    ) {


        const estado =

            Boolean(

                valores?.[i]

            );


        const button =

            document.getElementById(

                `doButton${i}`

            );


        button.classList.toggle(

            'on',

            estado

        );


        button.textContent =

            estado

                ? 'ON'

                : 'OFF';


        if (

            estado

        ) {

            activos++;

        }

    }


    document.getElementById(

        'doActive'

    ).textContent =

        activos;

}


// =====================================
// ACTUALIZAR AI
// =====================================


function actualizarAI(

    valores

) {


    for (

        let i = 0;

        i < NUM_AI;

        i++

    ) {


        const valor =

            Number(

                valores?.[i] ?? 0

            );


        document.getElementById(

            `aiValue${i}`

        ).textContent =

            valor.toFixed(

                2

            );


        aiHistory[i].push(

            valor

        );


        if (

            aiHistory[i].length >

            MAX_HISTORY

        ) {


            aiHistory[i].shift();

        }


        const maximo =

            Math.max(

                ...aiHistory[i],

                1

            );


        const porcentaje =

            Math.min(

                (

                    valor /

                    maximo

                )

                *

                100,

                100

            );


        document.getElementById(

            `aiFill${i}`

        ).style.width =

            porcentaje +

            '%';


        Plotly.react(

            `aiChart${i}`,

            [

                {

                    y:

                        aiHistory[i],

                    mode:

                        'lines',

                    line:

                        {

                            width: 2

                        }

                }

            ],

            {

                margin:

                    {

                        t: 5,

                        r: 5,

                        b: 20,

                        l: 35

                    },

                paper_bgcolor:

                    'rgba(0,0,0,0)',

                plot_bgcolor:

                    'rgba(0,0,0,0)',

                xaxis:

                    {

                        visible: false

                    },

                yaxis:

                    {

                        gridcolor:

                            '#344452'

                    }

            },

            {

                displayModeBar:

                    false,

                responsive:

                    true

            }

        );

    }

}


// =====================================
// LEER NODE-RED
// =====================================


async function actualizarDatos() {


    try {


        const response =

            await fetch(

                STATUS_URL +

                '?t=' +

                Date.now()

            );


        if (

            !response.ok

        ) {

            throw new Error(

                'HTTP ' +

                response.status

            );

        }


        const data =

            await response.json();


        actualizarDI(

            data.DI

        );


        actualizarDO(

            data.DO

        );


        actualizarAI(

            data.AI

        );


        document.getElementById(

            'connectionLed'

        ).classList.add(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'NODE-RED CONECTADO';


        document.getElementById(

            'lastUpdate'

        ).textContent =

            new Date()

            .toLocaleTimeString();


    }


    catch (

        error

    ) {


        console.error(

            'Error Node-RED:',

            error

        );


        document.getElementById(

            'connectionLed'

        ).classList.remove(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'NODE-RED DESCONECTADO';


    }

}


// =====================================
// ESCRIBIR DO
// =====================================


async function escribirDO(

    channel,

    value

) {


    try {


        const response =

            await fetch(

                DO_URL,

                {


                    method:

                        'POST',


                    headers:

                        {

                            'Content-Type':

                                'application/json'

                        },


                    body:

                        JSON.stringify(

                            {

                                channel:

                                    channel,

                                value:

                                    value

                            }

                        )

                }

            );


        if (

            !response.ok

        ) {


            throw new Error(

                'HTTP ' +

                response.status

            );

        }


        await actualizarDatos();


    }


    catch (

        error

    ) {


        console.error(

            'Error escribiendo DO:',

            error

        );

    }

}


// =====================================
// INICIO
// =====================================


crearDI();


crearDO();


crearAI();


actualizarDatos();


setInterval(

    actualizarDatos,

    1000

);


</script>

</body>

</html>
