<html lang="es">

<head>

</head>

<body>

```
<div id="info">

    <h2>Three.js M4000</h2>

    <div class="estado">

        Node-RED:

        <span id="conexion">

            DESCONECTADO

        </span>

    </div>

    <div class="estado">

        DO3:

        <span id="do3">

            ---

        </span>

    </div>

    <div class="estado">

        AI0:

        <span id="ai0">

            ---

        </span>

    </div>

    <button id="btnDO3">

        ACTIVAR DO3

    </button>

</div>


<script type="module">


    // =====================================
    // THREE.JS
    // =====================================


    import * as THREE from

        'https://unpkg.com/three@0.178.0/build/three.module.js';


    // =====================================
    // ESCENA
    // =====================================


    const scene =

        new THREE.Scene();


    // =====================================
    // CÁMARA
    // =====================================


    const camera =

        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /

            window.innerHeight,

            0.1,

            1000

        );


    camera.position.z = 5;


    // =====================================
    // RENDERER
    // =====================================


    const renderer =

        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    // =====================================
    // CUBO
    // =====================================


    const geometry =

        new THREE.BoxGeometry(

            2,

            2,

            2

        );


    const material =

        new THREE.MeshStandardMaterial({

            color: 0x00ff00

        });


    const cube =

        new THREE.Mesh(

            geometry,

            material

        );


    scene.add(cube);


    // =====================================
    // LUZ
    // =====================================


    const light =

        new THREE.DirectionalLight(

            0xffffff,

            3

        );


    light.position.set(

        5,

        5,

        5

    );


    scene.add(light);


    // =====================================
    // CONFIGURACIÓN NODE-RED
    // =====================================


    const NODE_RED_BASE =

        'https://192.168.1.211/u-os-app-node-red-host/red';


    const STATUS_URL =

        NODE_RED_BASE +

        '/api/m4000/status';


    const DO_URL =

        NODE_RED_BASE +

        '/api/m4000/do';


    // =====================================
    // VARIABLES
    // =====================================


    let estadoDO3 = false;


    // =====================================
    // ACTUALIZAR DATOS
    // =====================================


    async function actualizarDatos() {


        try {


            const response =

                await fetch(

                    STATUS_URL

                );


            if (!response.ok) {

                throw new Error(

                    'HTTP ' +

                    response.status

                );

            }


            const data =

                await response.json();


            console.log(

                'Datos recibidos desde Node-RED:',

                data

            );


            // ==============================
            // CONEXIÓN
            // ==============================


            const conexion =

                document.getElementById(

                    'conexion'

                );


            conexion.textContent =

                'CONECTADO';


            conexion.className =

                'ok';


            // ==============================
            // DO3
            // ==============================


            estadoDO3 =

                Boolean(

                    data.DO?.[3]

                );


            document.getElementById(

                'do3'

            ).textContent =

                estadoDO3 ?

                'ON' :

                'OFF';


            // ==============================
            // AI0
            // ==============================


            document.getElementById(

                'ai0'

            ).textContent =

                data.AI?.[0] ??

                '---';


            // ==============================
            // CONTROL DEL CUBO
            // ==============================


            if (

                estadoDO3 === true

            ) {


                cube.rotation.x +=

                    0.05;


                cube.rotation.y +=

                    0.05;


            }


            // ==============================
            // TEXTO DEL BOTÓN
            // ==============================


            document.getElementById(

                'btnDO3'

            ).textContent =

                estadoDO3 ?

                'DESACTIVAR DO3' :

                'ACTIVAR DO3';


        }


        catch (error) {


            console.error(

                'Error leyendo Node-RED:',

                error

            );


            const conexion =

                document.getElementById(

                    'conexion'

                );


            conexion.textContent =

                'DESCONECTADO';


            conexion.className =

                'error';


        }


    }


    // =====================================
    // ESCRIBIR DO3
    // =====================================


    async function escribirDO3(

        value

    ) {


        try {


            const response =

                await fetch(

                    DO_URL,

                    {


                        method: 'POST',


                        headers: {


                            'Content-Type':

                                'application/json'


                        },


                        body: JSON.stringify({

                            channel: 3,

                            value: value

                        })


                    }

                );


            const data =

                await response.json();


            console.log(

                'Respuesta escritura DO3:',

                data

            );


            if (

                !response.ok

            ) {


                throw new Error(

                    'Error HTTP ' +

                    response.status

                );


            }


            // Actualizar inmediatamente

            await actualizarDatos();


        }


        catch (error) {


            console.error(

                'Error escribiendo DO3:',

                error

            );


        }


    }


    // =====================================
    // BOTÓN DO3
    // =====================================


    document.getElementById(

        'btnDO3'

    ).addEventListener(

        'click',

        function () {


            const nuevoEstado =

                !estadoDO3;


            escribirDO3(

                nuevoEstado

            );


        }

    );


    // =====================================
    // LECTURA PERIÓDICA
    // =====================================


    actualizarDatos();


    setInterval(

        actualizarDatos,

        1000

    );


    // =====================================
    // ANIMACIÓN
    // =====================================


    function animate() {


        requestAnimationFrame(

            animate

        );


        // Rotación lenta siempre

        cube.rotation.x +=

            0.005;


        cube.rotation.y +=

            0.005;


        renderer.render(

            scene,

            camera

        );


    }


    animate();


    // =====================================
    // REDIMENSIONAR
    // =====================================


    window.addEventListener(

        'resize',

        function () {


            camera.aspect =

                window.innerWidth /

                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(

                window.innerWidth,

                window.innerHeight

            );


        }

    );


</script>
```

</body>

</html>
