<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M4000 Industrial Dashboard</title>

<style>

:root {

    --bg: #131a24;
    --bg-2: #1a2330;
    --panel: rgba(28, 38, 50, 0.85);
    --panel-solid: #1c2633;
    --panel-light: rgba(40, 52, 68, 0.72);
    --border: rgba(70, 92, 118, 0.55);
    --border-light: rgba(108, 136, 168, 0.38);
    --text: #f4f7fb;
    --muted: #9db0c4;
    --green: #00e096;
    --red: #ff5c6c;
    --yellow: #ffb624;
    --orange: #ff8c42;
    --blue: #2fb3ff;
    --cyan: #00e0ff;

}

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    background:
        radial-gradient(ellipse at 10% 0%, #1b2736 0%, transparent 50%),
        radial-gradient(ellipse at 90% 100%, #182230 0%, transparent 50%),
        var(--bg);

    color: var(--text);

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

    min-height: 100vh;

}


/* =====================================
   BARRA SUPERIOR
===================================== */

.topbar {

    height: 68px;

    background:
        linear-gradient(180deg, rgba(24, 33, 44, 0.95), rgba(18, 25, 34, 0.92));

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 28px;

    backdrop-filter: blur(14px);

    -webkit-backdrop-filter: blur(14px);

    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);

}


.logo {

    font-size: 21px;

    font-weight: 800;

    letter-spacing: 1.2px;

    display: flex;

    align-items: center;

    gap: 10px;

}


.logo::before {

    content: '';

    width: 9px;

    height: 28px;

    background: linear-gradient(180deg, var(--cyan), var(--blue));

    border-radius: 3px;

    box-shadow: 0 0 14px rgba(0, 224, 255, 0.45);

}


.logo span {

    color: var(--cyan);

    font-weight: 700;

}


.nav {

    display: flex;

    gap: 10px;

    background: rgba(255, 255, 255, 0.04);

    padding: 5px;

    border-radius: 10px;

    border: 1px solid rgba(255, 255, 255, 0.06);

}


.nav button {

    background: transparent;

    color: var(--muted);

    border: 1px solid transparent;

    padding: 10px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-weight: 700;

    font-size: 13px;

    transition: all 0.18s ease;

}


.nav button:hover {

    color: #fff;

    background: rgba(255, 255, 255, 0.08);

}


.nav button.active {

    color: #fff;

    background:
        linear-gradient(180deg, rgba(52, 72, 94, 0.9), rgba(36, 50, 66, 0.9));

    border-color: rgba(0, 224, 255, 0.45);

    box-shadow: 0 0 16px rgba(0, 224, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.08);

}


.connection {

    display: flex;

    align-items: center;

    gap: 10px;

    color: var(--muted);

    font-size: 13px;

    font-weight: 700;

    background: rgba(255, 255, 255, 0.04);

    padding: 7px 14px;

    border-radius: 20px;

    border: 1px solid var(--border);

}


.connection-dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: var(--red);

    box-shadow: 0 0 10px rgba(255, 92, 108, 0.6);

}


.connection-dot.ok {

    background: var(--green);

    box-shadow: 0 0 10px rgba(0, 224, 150, 0.6);

}


/* =====================================
   CONTENEDOR
===================================== */

.container {

    padding: 28px 34px;

    max-width: 100%;

}


.page-title {

    margin-bottom: 22px;

}


.page-title h1 {

    margin: 0;

    font-size: 28px;

    font-weight: 800;

    letter-spacing: -0.3px;

}


.page-title p {

    margin: 8px 0 0;

    color: var(--muted);

    font-size: 14px;

}


/* =====================================
   KPIS
===================================== */

.kpi-grid {

    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

    gap: 18px;

    margin-bottom: 24px;

}


.kpi {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 16px 18px;

    display: flex;

    align-items: center;

    gap: 14px;

    backdrop-filter: blur(10px);

    -webkit-backdrop-filter: blur(10px);

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

}


.kpi-icon {

    width: 44px;

    height: 44px;

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 20px;

    background: rgba(47, 179, 255, 0.12);

    border: 1px solid rgba(47, 179, 255, 0.25);

}


.kpi-icon.di { background: rgba(0, 224, 150, 0.12); border-color: rgba(0, 224, 150, 0.25); }
.kpi-icon.do { background: rgba(255, 182, 36, 0.12); border-color: rgba(255, 182, 36, 0.25); }


.kpi-content {

    display: flex;

    flex-direction: column;

}


.kpi-label {

    font-size: 11px;

    color: var(--muted);

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.5px;

}


.kpi-value {

    font-size: 22px;

    font-weight: 800;

    margin-top: 2px;

}


/* =====================================
   GRID
===================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                340px,
                1fr
            )
        );

    gap: 22px;

    justify-items: stretch;

}


@media (min-width: 1200px) {

    .grid {

        grid-template-columns: repeat(3, 1fr);

    }

}


/* =====================================
   PANEL
===================================== */

.panel {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 14px;

    padding: 20px;

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

}


.panel h2 {

    margin: 0;

    font-size: 15px;

    font-weight: 800;

    color: var(--text);

    letter-spacing: 0.2px;

}


.panel-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;

}


.badge {

    font-size: 11px;

    padding: 5px 10px;

    border-radius: 6px;

    background: rgba(47, 179, 255, 0.1);

    color: var(--blue);

    font-weight: 800;

    border: 1px solid rgba(47, 179, 255, 0.2);

}


/* =====================================
   ENTRADAS DIGITALES
===================================== */

.io-grid {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap: 10px;

}


.io-item {

    background: var(--panel-light);

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 14px 8px;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;

    transition: all 0.15s ease;

}


.io-item:hover {

    border-color: var(--border-light);

    background: rgba(255, 255, 255, 0.05);

}


.io-label {

    font-size: 12px;

    color: var(--muted);

    font-weight: 700;

}


.io-led {

    width: 18px;

    height: 18px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.08);

    border: 2px solid rgba(255, 255, 255, 0.1);

    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);

    transition: all 0.2s ease;

}


.io-led.on {

    background: var(--green);

    border-color: rgba(0, 224, 150, 0.6);

    box-shadow:
        0 0 14px rgba(0, 224, 150, 0.6),
        inset 0 2px 6px rgba(255, 255, 255, 0.3);

}


.io-led.off {

    background: rgba(255, 92, 108, 0.25);

    border-color: rgba(255, 92, 108, 0.4);

    box-shadow: 0 0 8px rgba(255, 92, 108, 0.15);

}


.io-state {

    font-size: 11px;

    font-weight: 800;

    color: var(--muted);

}


/* =====================================
   SALIDAS CONTROLABLES
===================================== */

.do-grid {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap: 12px;

}


.do-item {

    background: var(--panel-light);

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 12px;

    transition: all 0.15s ease;

}


.do-item:hover {

    border-color: var(--border-light);

}


.do-name {

    font-size: 12px;

    color: var(--muted);

    margin-bottom: 10px;

    font-weight: 700;

    text-align: center;

}


.do-switch {

    position: relative;

    width: 100%;

    height: 32px;

    border-radius: 16px;

    border: 1px solid var(--border);

    background: rgba(255, 255, 255, 0.06);

    cursor: pointer;

    transition: all 0.2s ease;

}


.do-switch::before {

    content: 'OFF';

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    font-size: 10px;

    font-weight: 800;

    color: var(--muted);

    transition: all 0.2s ease;

}


.do-knob {

    position: absolute;

    left: 5px;

    top: 50%;

    width: 22px;

    height: 22px;

    margin-top: -11px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.25);

    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);

    transition: all 0.2s ease;

}


.do-switch.on {

    background: rgba(0, 224, 150, 0.18);

    border-color: rgba(0, 224, 150, 0.45);

    box-shadow: 0 0 16px rgba(0, 224, 150, 0.12);

}


.do-switch.on::before {

    content: 'ON';

    left: 10px;

    right: auto;

    color: var(--green);

}


.do-switch.on .do-knob {

    left: calc(100% - 27px);

    background: var(--green);

    box-shadow: 0 0 12px rgba(0, 224, 150, 0.5);

}


/* =====================================
   ANALÓGICAS - GAUGES
===================================== */

.ai-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap: 18px;

}


.ai-card {

    background: var(--panel-light);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 18px;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    overflow: hidden;

    transition: all 0.15s ease;

}


.ai-card::before {

    content: '';

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    height: 2px;

    background: linear-gradient(90deg, var(--cyan), var(--blue));

    opacity: 0.6;

}


.ai-card:hover {

    border-color: var(--border-light);

}


.ai-header {

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;

}


.ai-label {

    color: var(--muted);

    font-size: 12px;

    font-weight: 800;

}


.ai-badge {

    font-size: 10px;

    padding: 3px 7px;

    border-radius: 4px;

    background: rgba(47, 179, 255, 0.1);

    color: var(--blue);

    font-weight: 800;

}


.ai-gauge {

    width: 160px;

    height: 90px;

    margin: 8px 0;

}


.ai-gauge-track {

    fill: none;

    stroke: rgba(255, 255, 255, 0.08);

    stroke-width: 12;

    stroke-linecap: round;

}


.ai-gauge-fill {

    fill: none;

    stroke-width: 12;

    stroke-linecap: round;

    transition: stroke-dashoffset 0.4s ease, stroke 0.4s ease;

}


.ai-value {

    font-size: 32px;

    font-weight: 800;

    margin-top: 4px;

    letter-spacing: -1px;

}


.ai-range {

    color: var(--muted);

    font-size: 11px;

    font-weight: 700;

    margin-top: 4px;

}


/* =====================================
   GRÁFICO
===================================== */

.chart-panel {

    grid-column: 1 / -1;

}


.chart-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 14px;

}


.chart-legend {

    display: flex;

    gap: 16px;

    font-size: 11px;

    font-weight: 700;

}


.chart-legend span {

    display: flex;

    align-items: center;

    gap: 6px;

    color: var(--muted);

}


.chart-legend span::before {

    content: '';

    width: 10px;

    height: 3px;

    border-radius: 2px;

}


#aiChart {

    width: 100%;

    height: 280px;

    display: block;

    background:
        linear-gradient(180deg, #0b1319, #070c11);

    border: 1px solid var(--border);

    border-radius: 10px;

}


/* =====================================
   RESPONSIVE
===================================== */

@media (max-width: 900px) {

    .topbar {

        padding: 0 16px;

        height: auto;

        min-height: 64px;

        flex-wrap: wrap;

        gap: 10px;

    }


    .nav {

        order: 3;

        width: 100%;

        justify-content: center;

        margin-bottom: 4px;

    }


    .container {

        padding: 18px;

    }


    .kpi-grid {

        grid-template-columns: 1fr 1fr;

    }


    .io-grid,

    .do-grid {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

}


@media (max-width: 520px) {

    .kpi-grid {

        grid-template-columns: 1fr;

    }


    .ai-grid {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<header class="topbar">


    <div class="logo">

        M4000 <span>INDUSTRIAL</span>

    </div>


    <nav class="nav">


        <button

            class="active"

            onclick="location.href='index.html'">

            Dashboard

        </button>


        <button

            onclick="location.href='demo-troncos.html'">

            Demo Troncos

        </button>


        <button

            onclick="location.href='demo-api-ree.html'">

            Demo REE

        </button>


        <button

            onclick="location.href='demo-registrador.html'">

            Demo Registrador

        </button>


    </nav>


    <div class="connection">


        <div

            id="connectionDot"

            class="connection-dot">

        </div>


        <span

            id="connectionText">

            DESCONECTADO

        </span>


    </div>


</header>


<main class="container">


    <div class="page-title">


        <h1>

            Dashboard de control

        </h1>


        <p>

            Monitorización de entradas, salidas y señales analógicas

        </p>


    </div>


    <div class="kpi-grid">


        <div class="kpi">

            <div class="kpi-icon di">IN</div>

            <div class="kpi-content">

                <div class="kpi-label">DI activas</div>

                <div id="kpiDi" class="kpi-value">0</div>

            </div>

        </div>


        <div class="kpi">

            <div class="kpi-icon do">OUT</div>

            <div class="kpi-content">

                <div class="kpi-label">DO activas</div>

                <div id="kpiDo" class="kpi-value">0</div>

            </div>

        </div>


    </div>


    <div class="grid">


        <!-- DI -->

        <section class="panel">


            <div class="panel-header">


                <h2>

                    Entradas digitales

                </h2>


                <span class="badge">

                    DI 0-15

                </span>


            </div>


            <div

                id="diGrid"

                class="io-grid">

            </div>


        </section>


        <!-- DO -->

        <section class="panel">


            <div class="panel-header">


                <h2>

                    Salidas digitales

                </h2>


                <span class="badge">

                    DO 0-15

                </span>


            </div>


            <div

                id="doGrid"

                class="do-grid">

            </div>


        </section>


        <!-- AI -->

        <section class="panel">


            <div class="panel-header">


                <h2>

                    Entradas analógicas

                </h2>


                <span class="badge">

                    AI 0-1000

                </span>


            </div>


            <div

                id="aiGrid"

                class="ai-grid">

            </div>


        </section>


        <!-- CHART -->

        <section class="panel chart-panel">


            <div class="chart-header">


                <h2>

                    Tendencia analógicas

                </h2>


                <div class="chart-legend">

                    <span style="--color: #00e0ff"><span style="background: #00e0ff; width: 10px; height: 3px; display: inline-block; border-radius: 2px; margin-right: 6px;"></span>AI0</span>

                    <span style="--color: #00e096"><span style="background: #00e096; width: 10px; height: 3px; display: inline-block; border-radius: 2px; margin-right: 6px;"></span>AI1</span>

                    <span style="--color: #ffb624"><span style="background: #ffb624; width: 10px; height: 3px; display: inline-block; border-radius: 2px; margin-right: 6px;"></span>AI2</span>

                    <span style="--color: #ff5c6c"><span style="background: #ff5c6c; width: 10px; height: 3px; display: inline-block; border-radius: 2px; margin-right: 6px;"></span>AI3</span>

                </div>


            </div>


            <canvas

                id="aiChart"

                width="1200"

                height="280">

            </canvas>


        </section>


    </div>


</main>


<script>


const STATUS_URL =

    '/api/m4000/status';


const DO_URL =

    '/api/m4000/do';


const AI_COLORS = [

    '#00e0ff',
    '#00e096',
    '#ffb624',
    '#ff5c6c'

];


const AI_HISTORY_SECONDS =

    60;


const aiHistory =

    [];


const diGrid =

    document.getElementById(

        'diGrid'

    );


const doGrid =

    document.getElementById(

        'doGrid'

    );


const aiGrid =

    document.getElementById(

        'aiGrid'

    );


/* =====================================
   CREAR DI
===================================== */

for (

    let i = 0;

    i < 16;

    i++

) {


    diGrid.innerHTML += `

        <div class="io-item">

            <div class="io-label">DI${i}</div>

            <div id="di-${i}" class="io-led off"></div>

            <div id="di-text-${i}" class="io-state">OFF</div>

        </div>

    `;

}


/* =====================================
   CREAR DO
===================================== */

for (

    let i = 0;

    i < 16;

    i++

) {


    doGrid.innerHTML += `

        <div class="do-item">

            <div class="do-name">DO${i}</div>

            <div id="do-${i}" class="do-switch" onclick="toggleDO(${i})">

                <div class="do-knob"></div>

            </div>

        </div>

    `;

}


/* =====================================
   CREAR AI
===================================== */

for (

    let i = 0;

    i < 4;

    i++

) {


    aiGrid.innerHTML += `

        <div class="ai-card">

            <div class="ai-header">

                <div class="ai-label">AI${i}</div>

                <div class="ai-badge">0-1000</div>

            </div>

            <svg class="ai-gauge" viewBox="0 0 160 90">

                <path class="ai-gauge-track" d="M 20 80 A 60 60 0 0 1 140 80"></path>

                <path

                    id="ai-gauge-${i}"

                    class="ai-gauge-fill"

                    d="M 20 80 A 60 60 0 0 1 140 80"

                    stroke-dasharray="188.5"

                    stroke-dashoffset="188.5">

                </path>

            </svg>

            <div id="ai-${i}" class="ai-value" style="color: ${AI_COLORS[i]}">---</div>

            <div class="ai-range">0 - 1000</div>

        </div>

    `;

}


/* =====================================
   GAUGE
===================================== */

function colorPorValor(

    valor

) {


    if (valor < 700) {

        return '#00e096';

    }


    if (valor < 900) {

        return '#ffb624';

    }


    return '#ff5c6c';

}


function actualizarGauge(

    index,

    valor

) {


    const gauge =

        document.getElementById(

            `ai-gauge-${index}`

        );


    const porcentaje =

        Math.max(

            0,

            Math.min(

                1000,

                valor

            )

        ) / 1000;


    const offset =

        188.5 *

        (1 - porcentaje);


    gauge.style.strokeDashoffset =

        offset;


    gauge.style.stroke =

        colorPorValor(

            valor

        );

}


/* =====================================
   GRÁFICO
===================================== */

function dibujarChart() {


    const canvas =

        document.getElementById(

            'aiChart'

        );


    const ctx =

        canvas.getContext(

            '2d'

        );


    const width =

        canvas.width;


    const height =

        canvas.height;


    const padding =

        { top: 25, right: 20, bottom: 35, left: 50 };


    ctx.clearRect(

        0,

        0,

        width,

        height

    );


    ctx.fillStyle =

        '#080d12';


    ctx.fillRect(

        0,

        0,

        width,

        height

    );


    if (

        aiHistory.length < 2

    ) {

        return;

    }


    const chartWidth =

        width - padding.left - padding.right;


    const chartHeight =

        height - padding.top - padding.bottom;


    /* Cuadrícula */

    ctx.strokeStyle =

        '#1e303c';


    ctx.lineWidth =

        1;


    for (

        let i = 0;

        i <= 4;

        i++

    ) {

        const y =

            padding.top +

            chartHeight *

            (i / 4);


        ctx.beginPath();

        ctx.moveTo(

            padding.left,

            y

        );

        ctx.lineTo(

            width - padding.right,

            y

        );

        ctx.stroke();


        const valor =

            1000 -

            1000 *

            (i / 4);


        ctx.fillStyle =

            '#8fa3b8';


        ctx.font =

            '11px Inter, Segoe UI, Arial';


        ctx.textAlign =

            'right';


        ctx.fillText(

            valor,

            padding.left - 10,

            y + 4

        );

    }


    /* Líneas */

    for (

        let ai = 0;

        ai < 4;

        ai++

    ) {

        ctx.beginPath();

        ctx.strokeStyle =

            AI_COLORS[ai];


        ctx.lineWidth =

            2;


        ctx.shadowColor =

            AI_COLORS[ai];


        ctx.shadowBlur =

            6;


        aiHistory.forEach(

            (

                punto,

                index

            ) => {


                const x =

                    padding.left +

                    index /

                    (aiHistory.length - 1) *

                    chartWidth;


                const y =

                    padding.top +

                    chartHeight *

                    (

                        1 -

                        punto.values[ai] / 1000

                    );


                if (

                    index === 0

                ) {

                    ctx.moveTo(

                        x,

                        y

                    );

                } else {

                    ctx.lineTo(

                        x,

                        y

                    );

                }

            }

        );


        ctx.stroke();

        ctx.shadowBlur =

            0;

    }


    /* Eje X */

    ctx.fillStyle =

        '#8fa3b8';


    ctx.textAlign =

        'center';


    ctx.font =

        '10px Inter, Segoe UI, Arial';


    ctx.fillText(

        '-60s',

        padding.left,

        height - 10

    );


    ctx.fillText(

        'ahora',

        width - padding.right,

        height - 10

    );

}


/* =====================================
   ACTUALIZAR
===================================== */

async function actualizarDatos() {


    try {


        const response =

            await fetch(

                STATUS_URL +

                '?t=' +

                Date.now()

            );


        if (

            !response.ok

        ) {


            throw new Error(

                'HTTP ' +

                response.status

            );

        }


        const data =

            await response.json();


        document.getElementById(

            'connectionDot'

        ).classList.add(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'CONECTADO';


        let diActivas =

            0;


        for (

            let i = 0;

            i < 16;

            i++

        ) {


            const estado =

                Boolean(

                    data.DI?.[i]

                );


            const led =

                document.getElementById(

                    `di-${i}`

                );


            const texto =

                document.getElementById(

                    `di-text-${i}`

                );


            led.className =

                estado

                    ? 'io-led on'

                    : 'io-led off';


            texto.textContent =

                estado

                    ? 'ON'

                    : 'OFF';


            if (estado) {

                diActivas++;

            }

        }


        document.getElementById(

            'kpiDi'

        ).textContent =

            diActivas;


        let doActivas =

            0;


        for (

            let i = 0;

            i < 16;

            i++

        ) {


            const estado =

                Boolean(

                    data.DO?.[i]

                );


            const sw =

                document.getElementById(

                    `do-${i}`

                );


            sw.className =

                estado

                    ? 'do-switch on'

                    : 'do-switch';


            if (estado) {

                doActivas++;

            }

        }


        document.getElementById(

            'kpiDo'

        ).textContent =

            doActivas;


        const valores =

            [];


        for (

            let i = 0;

            i < 4;

            i++

        ) {


            const valor =

                data.AI?.[i] ??

                0;


            valores.push(

                valor

            );


            document.getElementById(

                `ai-${i}`

            ).textContent =

                valor;


            actualizarGauge(

                i,

                valor

            );

        }


        aiHistory.push(

            {

                time: Date.now(),

                values: valores

            }

        );


        const limite =

            Date.now() -

            AI_HISTORY_SECONDS *

            1000;


        while (

            aiHistory.length > 0

            &&

            aiHistory[0].time < limite

        ) {

            aiHistory.shift();

        }


        dibujarChart();


    }


    catch (

        error

    ) {


        document.getElementById(

            'connectionDot'

        ).classList.remove(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'DESCONECTADO';

    }

}


/* =====================================
   ESCRIBIR DO
===================================== */

async function toggleDO(

    channel

) {


    const sw =

        document.getElementById(

            `do-${channel}`

        );


    const nuevoEstado =

        !sw.classList.contains(

            'on'

        );


    try {


        await fetch(

            DO_URL,

            {

                method: 'POST',

                headers: {

                    'Content-Type':

                        'application/json'

                },

                body: JSON.stringify({

                    channel:

                        channel,

                    value:

                        nuevoEstado

                })

            }

        );


        await actualizarDatos();


    }


    catch (

        error

    ) {


        console.error(

            error

        );

    }

}


/* =====================================
   INICIO
===================================== */

actualizarDatos();


setInterval(

    actualizarDatos,

    1000

);


window.addEventListener(

    'resize',

    () => {

        const canvas =

            document.getElementById(

                'aiChart'

            );


        canvas.width =

            canvas.offsetWidth;


        canvas.height =

            canvas.offsetHeight;


        dibujarChart();

    }

);

</script>
