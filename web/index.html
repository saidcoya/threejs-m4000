<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M4000 Industrial Dashboard</title>

<style>

:root {

    --bg: #070a0f;
    --bg-2: #0c1118;
    --panel: rgba(16, 23, 31, 0.82);
    --panel-solid: #10171f;
    --panel-light: rgba(26, 36, 48, 0.7);
    --border: rgba(54, 74, 95, 0.55);
    --border-light: rgba(88, 116, 146, 0.35);
    --text: #f0f5fa;
    --muted: #8fa3b8;
    --green: #00e096;
    --red: #ff5c6c;
    --yellow: #ffb624;
    --blue: #2fb3ff;
    --cyan: #00e0ff;

}

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    background:
        radial-gradient(ellipse at 10% 0%, #0f1824 0%, transparent 45%),
        radial-gradient(ellipse at 90% 100%, #0d151f 0%, transparent 45%),
        var(--bg);

    color: var(--text);

    font-family:
        "Inter",
        "Segoe UI",
        Arial,
        sans-serif;

    min-height: 100vh;

}


/* =====================================
   BARRA SUPERIOR
===================================== */

.topbar {

    height: 68px;

    background:
        linear-gradient(180deg, rgba(13, 19, 27, 0.95), rgba(10, 15, 21, 0.92));

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 28px;

    backdrop-filter: blur(14px);

    -webkit-backdrop-filter: blur(14px);

    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);

}


.logo {

    font-size: 21px;

    font-weight: 800;

    letter-spacing: 1.2px;

    display: flex;

    align-items: center;

    gap: 10px;

}


.logo::before {

    content: '';

    width: 9px;

    height: 28px;

    background: linear-gradient(180deg, var(--cyan), var(--blue));

    border-radius: 3px;

    box-shadow: 0 0 14px rgba(0, 224, 255, 0.45);

}


.logo span {

    color: var(--cyan);

    font-weight: 700;

}


.nav {

    display: flex;

    gap: 10px;

    background: rgba(0, 0, 0, 0.18);

    padding: 5px;

    border-radius: 10px;

    border: 1px solid rgba(255, 255, 255, 0.04);

}


.nav button {

    background: transparent;

    color: var(--muted);

    border: 1px solid transparent;

    padding: 10px 18px;

    border-radius: 7px;

    cursor: pointer;

    font-weight: 700;

    font-size: 13px;

    transition: all 0.18s ease;

}


.nav button:hover {

    color: #fff;

    background: rgba(255, 255, 255, 0.05);

}


.nav button.active {

    color: #fff;

    background:
        linear-gradient(180deg, rgba(38, 56, 74, 0.9), rgba(24, 36, 48, 0.9));

    border-color: rgba(0, 224, 255, 0.45);

    box-shadow: 0 0 16px rgba(0, 224, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.08);

}


.connection {

    display: flex;

    align-items: center;

    gap: 10px;

    color: var(--muted);

    font-size: 13px;

    font-weight: 700;

    background: rgba(0, 0, 0, 0.2);

    padding: 7px 14px;

    border-radius: 20px;

    border: 1px solid var(--border);

}


.connection-dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: var(--red);

    box-shadow: 0 0 10px rgba(255, 92, 108, 0.6);

}


.connection-dot.ok {

    background: var(--green);

    box-shadow: 0 0 10px rgba(0, 224, 150, 0.6);

}


/* =====================================
   CONTENEDOR
===================================== */

.container {

    padding: 28px;

    max-width: 1800px;

    margin: auto;

}


.page-title {

    margin-bottom: 26px;

}


.page-title h1 {

    margin: 0;

    font-size: 28px;

    font-weight: 800;

    letter-spacing: -0.3px;

}


.page-title p {

    margin: 8px 0 0;

    color: var(--muted);

    font-size: 14px;

}


/* =====================================
   GRID
===================================== */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                300px,
                1fr
            )
        );

    gap: 22px;

}


/* =====================================
   PANEL
===================================== */

.panel {

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 14px;

    padding: 20px;

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

    transition: transform 0.2s ease, box-shadow 0.2s ease;

}


.panel:hover {

    box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);

}


.panel h2 {

    margin: 0;

    font-size: 15px;

    font-weight: 800;

    color: var(--text);

    letter-spacing: 0.2px;

}


.panel-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 18px;

}


.badge {

    font-size: 11px;

    padding: 5px 10px;

    border-radius: 6px;

    background: rgba(47, 179, 255, 0.1);

    color: var(--blue);

    font-weight: 800;

    border: 1px solid rgba(47, 179, 255, 0.2);

}


/* =====================================
   ENTRADAS / SALIDAS
===================================== */

.io-grid {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap: 10px;

}


.io-item {

    background: var(--panel-light);

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 12px 8px;

    text-align: center;

    transition: all 0.15s ease;

}


.io-item:hover {

    border-color: var(--border-light);

    background: rgba(255, 255, 255, 0.05);

}


.io-label {

    font-size: 11px;

    color: var(--muted);

    margin-bottom: 8px;

    font-weight: 700;

}


.io-state {

    font-size: 13px;

    font-weight: 800;

    display: inline-flex;

    align-items: center;

    gap: 6px;

}


.io-state::before {

    content: '';

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: currentColor;

    box-shadow: 0 0 8px currentColor;

}


.io-state.on {

    color: var(--green);

}


.io-state.off {

    color: var(--red);

}


/* =====================================
   SALIDAS CONTROLABLES
===================================== */

.do-grid {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap: 10px;

}


.do-item {

    background: var(--panel-light);

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 12px;

    transition: all 0.15s ease;

}


.do-item:hover {

    border-color: var(--border-light);

}


.do-name {

    font-size: 12px;

    color: var(--muted);

    margin-bottom: 10px;

    font-weight: 700;

    text-align: center;

}


.do-button {

    width: 100%;

    border: none;

    border-radius: 8px;

    padding: 9px;

    cursor: pointer;

    font-weight: 800;

    font-size: 12px;

    background: rgba(255, 255, 255, 0.06);

    color: var(--muted);

    border: 1px solid var(--border);

    transition: all 0.15s ease;

}


.do-button:hover {

    background: rgba(255, 255, 255, 0.1);

    color: #fff;

}


.do-button.on {

    background:
        linear-gradient(180deg, rgba(0, 224, 150, 0.22), rgba(0, 224, 150, 0.1));

    color: var(--green);

    border-color: rgba(0, 224, 150, 0.45);

    box-shadow: 0 0 14px rgba(0, 224, 150, 0.15);

}


/* =====================================
   ANALÓGICAS
===================================== */

.ai-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap: 14px;

}


.ai-card {

    background: var(--panel-light);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 18px;

    position: relative;

    overflow: hidden;

    transition: all 0.15s ease;

}


.ai-card::before {

    content: '';

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    height: 2px;

    background: linear-gradient(90deg, var(--cyan), var(--blue));

    opacity: 0.6;

}


.ai-card:hover {

    border-color: var(--border-light);

}


.ai-label {

    color: var(--muted);

    font-size: 12px;

    font-weight: 700;

}


.ai-value {

    font-size: 32px;

    font-weight: 800;

    margin-top: 10px;

    color: var(--cyan);

    letter-spacing: -0.5px;

}


.ai-unit {

    color: var(--muted);

    font-size: 11px;

    margin-top: 4px;

}


/* =====================================
   RESPONSIVE
===================================== */

@media (max-width: 900px) {

    .topbar {

        padding: 0 16px;

        height: auto;

        min-height: 64px;

        flex-wrap: wrap;

        gap: 10px;

    }


    .nav {

        order: 3;

        width: 100%;

        justify-content: center;

        margin-bottom: 4px;

    }


    .container {

        padding: 18px;

    }


    .io-grid,

    .do-grid {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

}


@media (max-width: 520px) {

    .io-grid,

    .do-grid {

        grid-template-columns: 1fr 1fr;

    }

}

</style>

</head>


<body>


<header class="topbar">


    <div class="logo">

        M4000 <span>INDUSTRIAL</span>

    </div>


    <nav class="nav">


        <button

            class="active"

            onclick="location.href='index.html'">

            Dashboard

        </button>


        <button

            onclick="location.href='demo-troncos.html'">

            Demo Troncos

        </button>


        <button

            onclick="location.href='demo-api-ree.html'">

            Demo REE

        </button>


    </nav>


    <div class="connection">


        <div

            id="connectionDot"

            class="connection-dot">

        </div>


        <span

            id="connectionText">

            DESCONECTADO

        </span>


    </div>


</header>


<main class="container">


    <div class="page-title">


        <h1>

            Dashboard de control

        </h1>


        <p>

            Monitorización de entradas, salidas y señales analógicas

        </p>


    </div>


    <div class="grid">


        <!-- DI -->

        <section class="panel">


            <div class="panel-header">


                <h2>

                    Entradas digitales

                </h2>


                <span class="badge">

                    DI 0-15

                </span>


            </div>


            <div

                id="diGrid"

                class="io-grid">

            </div>


        </section>


        <!-- DO -->

        <section class="panel">


            <div class="panel-header">


                <h2>

                    Salidas digitales

                </h2>


                <span class="badge">

                    DO 0-15

                </span>


            </div>


            <div

                id="doGrid"

                class="do-grid">

            </div>


        </section>


        <!-- AI -->

        <section class="panel">


            <div class="panel-header">


                <h2>

                    Entradas analógicas

                </h2>


                <span class="badge">

                    AI

                </span>


            </div>


            <div

                id="aiGrid"

                class="ai-grid">

            </div>


        </section>


    </div>


</main>


<script>


const STATUS_URL =

    '/api/m4000/status';


const DO_URL =

    '/api/m4000/do';


const diGrid =

    document.getElementById(

        'diGrid'

    );


const doGrid =

    document.getElementById(

        'doGrid'

    );


const aiGrid =

    document.getElementById(

        'aiGrid'

    );


/* =====================================
   CREAR DI
===================================== */

for (

    let i = 0;

    i < 16;

    i++

) {


    diGrid.innerHTML += `

        <div class="io-item">

            <div class="io-label">

                DI${i}

            </div>

            <div

                id="di-${i}"

                class="io-state off">

                OFF

            </div>

        </div>

    `;

}


/* =====================================
   CREAR DO
===================================== */

for (

    let i = 0;

    i < 16;

    i++

) {


    doGrid.innerHTML += `

        <div class="do-item">

            <div class="do-name">

                DO${i}

            </div>

            <button

                id="do-${i}"

                class="do-button"

                onclick="toggleDO(${i})">

                OFF

            </button>

        </div>

    `;

}


/* =====================================
   CREAR AI
===================================== */

for (

    let i = 0;

    i < 4;

    i++

) {


    aiGrid.innerHTML += `

        <div class="ai-card">

            <div class="ai-label">

                AI${i}

            </div>

            <div

                id="ai-${i}"

                class="ai-value">

                ---

            </div>

            <div class="ai-unit">

                Valor actual

            </div>

        </div>

    `;

}


/* =====================================
   ACTUALIZAR
===================================== */

async function actualizarDatos() {


    try {


        const response =

            await fetch(

                STATUS_URL +

                '?t=' +

                Date.now()

            );


        if (

            !response.ok

        ) {


            throw new Error(

                'HTTP ' +

                response.status

            );

        }


        const data =

            await response.json();


        document.getElementById(

            'connectionDot'

        ).classList.add(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'CONECTADO';


        for (

            let i = 0;

            i < 16;

            i++

        ) {


            const estado =

                Boolean(

                    data.DI?.[i]

                );


            const elemento =

                document.getElementById(

                    `di-${i}`

                );


            elemento.textContent =

                estado

                    ? 'ON'

                    : 'OFF';


            elemento.className =

                estado

                    ? 'io-state on'

                    : 'io-state off';

        }


        for (

            let i = 0;

            i < 16;

            i++

        ) {


            const estado =

                Boolean(

                    data.DO?.[i]

                );


            const boton =

                document.getElementById(

                    `do-${i}`

                );


            boton.textContent =

                estado

                    ? 'ON'

                    : 'OFF';


            boton.className =

                estado

                    ? 'do-button on'

                    : 'do-button';

        }


        for (

            let i = 0;

            i < 4;

            i++

        ) {


            document.getElementById(

                `ai-${i}`

            ).textContent =

                data.AI?.[i] ??

                '---';

        }


    }


    catch (

        error

    ) {


        document.getElementById(

            'connectionDot'

        ).classList.remove(

            'ok'

        );


        document.getElementById(

            'connectionText'

        ).textContent =

            'DESCONECTADO';

    }

}


/* =====================================
   ESCRIBIR DO
===================================== */

async function toggleDO(

    channel

) {


    const boton =

        document.getElementById(

            `do-${channel}`

        );


    const nuevoEstado =

        !boton.classList.contains(

            'on'

        );


    try {


        await fetch(

            DO_URL,

            {

                method: 'POST',

                headers: {

                    'Content-Type':

                        'application/json'

                },

                body: JSON.stringify({

                    channel:

                        channel,

                    value:

                        nuevoEstado

                })

            }

        );


        await actualizarDatos();


    }


    catch (

        error

    ) {


        console.error(

            error

        );

    }

}


/* =====================================
   INICIO
===================================== */

actualizarDatos();


setInterval(

    actualizarDatos,

    1000

);

</script>


</body>

</html>
